[package]
name = "observability"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.103"
opentelemetry = "0.32.0"
# grpc-tonic for OTLP over gRPC on the standard 4317: the default
# feature set only builds the HTTP exporter.
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry-prometheus = "0.32.0"
# rt-tokio so the batch span processor has a runtime to flush on.
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
prometheus = "0.14.0"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
