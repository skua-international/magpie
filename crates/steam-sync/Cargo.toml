[package]
name = "steam-sync"
version = "0.1.0"
edition.workspace = true

[dependencies]
steamdepot = { git = "https://github.com/LinkIsGrim/steamdepot", rev = "517bb3e" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
anyhow = "1"
futures = "0.3"
tracing = "0.1"
serde_json = "1"
bincode = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
prost = "0.13"
walkdir = "2.5.0"
