[package]
name = "steam-sync"
version.workspace = true
edition.workspace = true

[dependencies]
steamdepot = { git = "https://github.com/LinkIsGrim/steamdepot", rev = "2986921" }
tokio = { version = "1", features = ["rt", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
anyhow = "1"
futures = "0.3"
tracing = "0.1"
serde_json = "1"
bincode = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
prost = "0.13"
walkdir = "2.5.0"

# Only used by src/bin/steam-login.rs's hidden password prompt -- see that
# file's own doc for why it lives here (a bin target on this crate)
# instead of as a separate workspace member.
rpassword = "7"
