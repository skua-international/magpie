[workspace]
resolver = "2"
members = ["crates/authn", "crates/crd", "crates/protocol", "crates/registry-db", "crates/steam-sync", "crates/sync-client", "crates/volume-client", "crates/workshop-parse", "services/controller", "services/identity", "services/launcher", "services/registry", "services/server-api", "services/sync-daemon", "services/volume-manager"]

[workspace.package]
edition = "2024"
# Placeholder, not the real version -- nothing in this repo commits a
# real version back here (see release.yml's own comment on why a release
# doesn't create a bump commit, same reasoning as charts/magpie/Chart.yaml's
# version field). Every member below inherits this through
# `version.workspace = true` rather than carrying its own, so it's still
# one shared value, just not one that reflects any real release.
version = "0.0.0-unreleased"
