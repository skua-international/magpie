name: Publish release artifacts

# Tag-triggered promotion step. Main branch builds produce branch/sha/latest
# images; this workflow runs only when semantic-release creates a release
# tag, then retags the already-built commit-SHA images with the semver tag
# and republishes the chart artifact for that exact tag.
on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-release-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/skua-international/magpie

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  retag-images:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve source sha tag
        id: source
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag release images
        run: |
          set -euo pipefail
          source_tag="${{ steps.source.outputs.sha }}"
          release_version="${{ steps.version.outputs.version }}"
          for service in launcher sync-daemon controller registry server-api identity; do
            image_ref="${IMAGE_BASE}/${service}"
            docker buildx imagetools create \
              --tag "${image_ref}:${release_version}" \
              --tag "${image_ref}:latest" \
              "${image_ref}:${source_tag}"
          done

  publish-chart:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push chart
        run: |
          helm package charts/magpie -d /tmp/chart-out --version "${{ steps.version.outputs.version }}" --app-version "${{ steps.version.outputs.version }}"
          helm push /tmp/chart-out/magpie-*.tgz oci://${{ env.IMAGE_BASE }}/charts
