name: Publish release artifacts

# Tag-triggered promotion step. Main branch builds produce branch/sha/latest
# images; this workflow runs only when semantic-release creates a release
# tag, then retags the already-built commit-SHA images with the semver tag
# and republishes the chart artifact for that exact tag.
on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-release-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/skua-international/magpie

jobs:
  retag-images:
    runs-on: elephant-runners
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve source sha tag
        id: source
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag release images
        run: |
          set -euo pipefail
          source_tag="${{ steps.source.outputs.sha }}"
          release_version="${{ steps.version.outputs.version }}"

          # This tag push (and release.yml's --create-tag) can land before
          # build-images.yml's own push of the sha-tagged source images
          # finishes -- confirmed live: retag-images failed with "not
          # found" ~2 minutes before build-images.yml actually pushed
          # that commit's images. wait-and-release.sh exists to prevent
          # this by construction, but nothing stops a release from being
          # triggered without it, so make this job itself robust to the
          # race instead of relying on whoever triggers a release to
          # remember the right order.
          wait_for_image() {
            local ref="$1" elapsed=0 timeout=600
            until docker buildx imagetools inspect "$ref" >/dev/null 2>&1; do
              if [ "$elapsed" -ge "$timeout" ]; then
                echo "timed out after ${timeout}s waiting for $ref to exist" >&2
                return 1
              fi
              echo "  waiting for $ref to exist (${elapsed}/${timeout}s)..."
              sleep 10
              elapsed=$((elapsed + 10))
            done
          }

          for service in launcher sync-daemon controller registry gateway identity magpie-csi; do
            image_ref="${IMAGE_BASE}/${service}"
            wait_for_image "${image_ref}:${source_tag}"
            docker buildx imagetools create \
              --tag "${image_ref}:${release_version}" \
              --tag "${image_ref}:latest" \
              "${image_ref}:${source_tag}"
          done

  publish-chart:
    runs-on: elephant-runners
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5

      - uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push chart
        run: |
          helm plugin uninstall push >/dev/null 2>&1 || true
          version="${{ steps.version.outputs.version }}"
          helm package charts/magpie -d /tmp/chart-out --version "$version" --app-version "$version"
          helm push "/tmp/chart-out/magpie-${version}.tgz" "oci://${{ env.IMAGE_BASE }}/charts"
