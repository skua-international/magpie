name: Build and push images

# Triggered off release.yml's completion, not its own push/tag triggers --
# release.yml runs on every push to main and, if semantic-release decides
# to cut a release, pushes a second (version-bump) commit itself. That
# second push is App-authored, so it *does* re-trigger workflows -- if
# this workflow also listened on push/tags directly, both the original
# push and the version-bump push would independently start a build here,
# with no ordering guarantee between the two. Whichever finished pushing
# `latest` last would win, possibly leaving `latest` built from the
# pre-bump commit even though a newer tagged release exists. Building
# only after release.yml fully completes -- checked out at its exact
# final head_sha -- makes this race impossible: exactly one build run per
# push to main, always against whatever main looks like once any version
# bump has already landed. Same fix shape as folding proto-stub
# regeneration into release.yml itself (see that workflow's own comment).
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/skua-international/magpie

jobs:
  # workflow_run-triggered runs never show up on the triggering commit's
  # own checks list -- GitHub only associates push/pull_request-triggered
  # runs with a commit automatically. Posting an explicit commit status
  # here (pending now, success/failure in report-status below) is what
  # makes "which build does this commit correspond to" visible on the
  # commit page/PR checks at all, since the Actions tab alone doesn't show
  # that association either for a workflow_run chain like this one.
  resolve:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      statuses: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.sha.outputs.sha }}',
              state: 'pending',
              context: 'images / build-and-push',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Building and pushing images + chart...',
            });

  build:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: launcher
            dockerfile: services/launcher/Dockerfile
          - name: sync-daemon
            dockerfile: services/sync-daemon/Dockerfile
          - name: controller
            dockerfile: services/controller/Dockerfile
          - name: registry
            dockerfile: services/registry/Dockerfile
          - name: server-api
            dockerfile: services/server-api/Dockerfile
          - name: identity
            dockerfile: services/identity/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          # release.yml's own head_sha -- the version-bump commit (if
          # semantic-release cut one) and its tag both already exist there
          # by the time it completes. A plain checkout of `main` would
          # usually land on the same commit, but pinning explicitly avoids
          # any window where another push has already landed on main
          # between release.yml finishing and this job starting.
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-tags: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short

      # All Dockerfiles build from the repo root (COPY . . -- every
      # service needs the whole workspace's Cargo.lock/manifests to
      # resolve via cargo-chef, see each Dockerfile's own comments), not
      # from their own service directory.
      #
      # One shared cache scope across the whole matrix, not one per
      # service: most of these share a large chunk of their cargo-chef
      # dependency layer (tokio, serde, sqlx, connectrpc, ...), so a
      # per-service scope would rebuild that overlap redundantly in every
      # job. The gha cache backend is content-addressed, so parallel jobs
      # writing to the same scope dedupe safely rather than race.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cargo
          cache-to: type=gha,mode=max,scope=cargo

  # Separate job, not part of the image matrix above -- packaging/pushing
  # the chart has nothing to do with any one service's Dockerfile. Publishes
  # as an OCI artifact (`helm push`), not a traditional index.yaml/gh-pages
  # chart repo -- OCI is the current recommended Helm distribution
  # mechanism (stable since Helm 3.8) and reuses the exact same GHCR
  # login/auth this workflow's image builds already do, no separate hosting
  # to stand up.
  publish-chart:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: azure/setup-helm@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push chart
        run: |
          helm package charts/magpie -d /tmp/chart-out
          helm push /tmp/chart-out/magpie-*.tgz oci://${{ env.IMAGE_BASE }}/charts

  # Reports final pass/fail back onto the commit resolve.sha started a
  # status on -- `if: always()` so a failed build/publish still gets
  # reported instead of leaving the commit stuck on "pending" forever.
  report-status:
    needs: [resolve, build, publish-chart]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ needs.build.result }}' === 'success' && '${{ needs.publish-chart.result }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.resolve.outputs.sha }}',
              state: ok ? 'success' : 'failure',
              context: 'images / build-and-push',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: ok ? 'Images + chart published' : 'Image or chart build failed',
            });
