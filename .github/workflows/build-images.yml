name: Build and push images

# Push-triggered on every main push for regular commit builds. Main keeps
# the fast branch/sha/latest images flowing; release tags are handled by a
# separate tag-only workflow so the promotion step cannot be filtered away
# by path rules here.
#
# Nothing here depends on generated/go or generated/ts (only cli/magpie
# and a future website would) -- crates/protocol's build.rs shells out to
# protoc directly against proto/ at `cargo build` time, so every service
# image here regenerates its own Rust bindings fresh on every build
# regardless of whether release.yml has run yet. That's what makes
# triggering directly off a monorepo-wide main push safe at all.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/skua-international/magpie

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  # Compiles all 7 service binaries once (Dockerfile.workspace, exported
  # locally via buildx rather than run/pushed), and hands them to the
  # build matrix below as a job artifact.
  #
  # Landed on "build in Docker, export locally" after two other
  # approaches each hit a real, different problem on elephant's
  # self-hosted runner:
  # - `container: image: rust:trixie` (GHA's job-container feature)
  #   breaks under elephant's Docker-outside-of-Docker setup: checkout
  #   needs the runner to bind-mount its own /actions-runner/externals
  #   into the spun-up job container, but that source path only resolves
  #   inside the runner's own container filesystem, not on the actual
  #   host -- confirmed live, "/__e/node24/bin/node: no such file or
  #   directory" even with a guaranteed-fresh runner image.
  # - Building natively on the bare runner (no Docker at all) traded
  #   that for a different real problem: elephant's runner is Ubuntu
  #   20.04, whose default gcc (9.4) aws-lc-sys explicitly refuses to
  #   build with -- a genuine known miscompilation bug (gcc.gnu.org/
  #   bugzilla 95189), not just an overly cautious version gate.
  # `docker build` doesn't have either problem: buildx streams the build
  # context over the Docker API rather than bind-mounting host paths
  # (exactly why the packaging steps' own docker/build-push-action calls
  # already work fine on this runner), and Dockerfile.workspace's
  # rust:trixie gives a modern gcc + a glibc matching every runtime
  # image (also trixie now) regardless of which runner actually built it.
  #
  # This also replaced an earlier cargo-chef multi-stage build duplicated
  # across all 7 Dockerfiles, dropped after two separate real caching
  # bugs in one session: a -p-scoping mismatch between `cook` and the
  # final build that silently defeated the cache even on a cook hit, and
  # a cache-scope race across concurrent matrix builds where one
  # service's planner stage imported a stale recipe.json from a
  # different commit. Compiling once removes both failure classes
  # outright -- there's only one job now, nothing to race.
  build-workspace:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Single job, single Dockerfile -- one cache scope, nothing else
      # ever writes to or races on it (see Dockerfile.workspace's own
      # comment on why that's what makes cargo-chef safe to use here at
      # all).
      - name: Build all service binaries
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.workspace
          target: dist
          push: false
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=workspace-build
          cache-to: type=gha,mode=max,scope=workspace-build

      - uses: actions/upload-artifact@v7
        with:
          name: magpie-binaries
          path: dist/
          # Only ever consumed by the `build` job in this same workflow
          # run -- no reason to keep it around after that.
          retention-days: 1

  build:
    needs: [pick-runner, build-workspace]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: launcher
            dockerfile: services/launcher/Dockerfile
          - name: sync-daemon
            dockerfile: services/sync-daemon/Dockerfile
          - name: controller
            dockerfile: services/controller/Dockerfile
          - name: registry
            dockerfile: services/registry/Dockerfile
          - name: server-api
            dockerfile: services/server-api/Dockerfile
          - name: identity
            dockerfile: services/identity/Dockerfile
          - name: magpie-csi
            dockerfile: services/magpie-csi/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          name: magpie-binaries
          path: dist/

      # Main-branch pushes produce branch/sha/latest images only; tag
      # promotion is done by the separate tag-only workflow.
      - name: Resolve version
        id: version
        run: echo "version=$(grep '^version:' charts/magpie/Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=,format=short

      # All Dockerfiles build from the repo root (COPY dist/<bin> --
      # dist/ is the artifact build-workspace produced above), not from
      # their own service directory. No cargo build happens in any of
      # these any more, but the apt-get layer (ca-certificates, or for
      # magpie-csi btrfs-progs/util-linux too) is still worth caching
      # -- unlike the old cargo-chef setup, there's no shared/racing scope
      # risk here at all: each service's own `RUN apt-get install ...`
      # line is different text (or doesn't exist, for the distroless
      # ones), so every service's own cache key is naturally distinct,
      # not something 7 concurrent jobs could race on the way 6 jobs
      # sharing one chef cook layer did.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pkg-${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=pkg-${{ matrix.service.name }}
# End of main-branch image build workflow.
