name: Build and push images

# Push-triggered directly (paths-filtered to what can actually change an
# image), not chained off release.yml's completion via workflow_run --
# workflow_run-triggered runs never show up on the triggering commit's
# own checks list (GitHub only auto-associates push/pull_request triggers
# that way), so that design traded a real, if narrow, correctness
# guarantee for a UX regression on every single commit. Push-triggering
# gets that back for free.
#
# The guarantee workflow_run chaining bought was ordering: release.yml
# runs on every push to main and, if semantic-release decides to cut a
# release, pushes a second (App-authored, so it re-triggers workflows)
# version-bump commit itself moments later. Two independent push-triggered
# runs -- one for the original commit, one for the bump commit -- could
# finish in either order, and whichever pushed `latest` last would win,
# possibly leaving it built from the pre-bump commit even though a newer
# tagged release exists. The `concurrency` block below is what actually
# prevents that: it cancels an in-progress run for an older commit the
# instant a newer one on the same ref queues, so a push followed shortly
# by a bump commit produces exactly one completed run -- the bump
# commit's -- not a race between two.
#
# Nothing here depends on generated/go or generated/ts (only cli/magpie
# and a future website would) -- crates/protocol's build.rs shells out to
# protoc directly against proto/ at `cargo build` time, so every service
# image here regenerates its own Rust bindings fresh on every build
# regardless of whether release.yml has run yet. That's what makes
# triggering directly off proto/service/chart changes safe at all.
on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "crates/**"
      - "proto/**"
      - "charts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/skua-international/magpie

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: launcher
            dockerfile: services/launcher/Dockerfile
          - name: sync-daemon
            dockerfile: services/sync-daemon/Dockerfile
          - name: controller
            dockerfile: services/controller/Dockerfile
          - name: registry
            dockerfile: services/registry/Dockerfile
          - name: server-api
            dockerfile: services/server-api/Dockerfile
          - name: identity
            dockerfile: services/identity/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      # docker/metadata-action's `type=semver` tag rule only reads
      # github.ref, so it only ever fires for an actual tag-push event --
      # it silently produces nothing on a branch push, even though the
      # release tag genuinely exists on this exact commit by the time
      # this job runs (release.yml pushes the version-bump commit *and*
      # its tag before completing, and both charts/magpie/Chart.yaml and
      # every Cargo.toml get bumped to match in that same commit -- see
      # scripts/bump-version.sh). Reading it straight from Chart.yaml
      # gives an explicit, reliable version tag instead of relying on
      # that auto-detection, which is what left every image untagged by
      # version for every release so far -- only `latest`/branch/sha
      # tags ever actually got published.
      - name: Resolve version
        id: version
        run: echo "version=$(grep '^version:' charts/magpie/Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=ref,event=branch
            type=sha,prefix=,format=short

      # All Dockerfiles build from the repo root (COPY . . -- every
      # service needs the whole workspace's Cargo.lock/manifests to
      # resolve via cargo-chef, see each Dockerfile's own comments), not
      # from their own service directory.
      #
      # One shared cache scope across the whole matrix, not one per
      # service: most of these share a large chunk of their cargo-chef
      # dependency layer (tokio, serde, sqlx, connectrpc, ...), so a
      # per-service scope would rebuild that overlap redundantly in every
      # job. The gha cache backend is content-addressed, so parallel jobs
      # writing to the same scope dedupe safely rather than race.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cargo
          cache-to: type=gha,mode=max,scope=cargo

  # Separate job, not part of the image matrix above -- packaging/pushing
  # the chart has nothing to do with any one service's Dockerfile. Publishes
  # as an OCI artifact (`helm push`), not a traditional index.yaml/gh-pages
  # chart repo -- OCI is the current recommended Helm distribution
  # mechanism (stable since Helm 3.8) and reuses the exact same GHCR
  # login/auth this workflow's image builds already do, no separate hosting
  # to stand up.
  publish-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push chart
        run: |
          helm package charts/magpie -d /tmp/chart-out
          helm push /tmp/chart-out/magpie-*.tgz oci://${{ env.IMAGE_BASE }}/charts
