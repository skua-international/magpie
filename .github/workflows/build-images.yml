name: Build and push images

# Push-triggered on every main push for regular commit builds. Main keeps
# the fast branch/sha/latest images flowing; release tags are handled by a
# separate tag-only workflow so the promotion step cannot be filtered away
# by path rules here.
#
# Nothing here depends on generated/go or generated/ts (only cli/magpie
# and a future website would) -- crates/protocol's build.rs shells out to
# protoc directly against proto/ at `cargo build` time, so every service
# image here regenerates its own Rust bindings fresh on every build
# regardless of whether release.yml has run yet. That's what makes
# triggering directly off a monorepo-wide main push safe at all.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/skua-international/magpie

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: launcher
            dockerfile: services/launcher/Dockerfile
          - name: sync-daemon
            dockerfile: services/sync-daemon/Dockerfile
          - name: controller
            dockerfile: services/controller/Dockerfile
          - name: registry
            dockerfile: services/registry/Dockerfile
          - name: server-api
            dockerfile: services/server-api/Dockerfile
          - name: identity
            dockerfile: services/identity/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      # Main-branch pushes produce branch/sha/latest images only; tag
      # promotion is done by the separate tag-only workflow.
      - name: Resolve version
        id: version
        run: echo "version=$(grep '^version:' charts/magpie/Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=,format=short

      # All Dockerfiles build from the repo root (COPY . . -- every
      # service needs the whole workspace's Cargo.lock/manifests to
      # resolve via cargo-chef, see each Dockerfile's own comments), not
      # from their own service directory.
      #
      # One shared cache scope across the whole matrix, not one per
      # service: most of these share a large chunk of their cargo-chef
      # dependency layer (tokio, serde, sqlx, connectrpc, ...), so a
      # per-service scope would rebuild that overlap redundantly in every
      # job. Make it branch-aware so unrelated refs do not churn the same
      # cache bucket.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cargo-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=cargo-${{ github.ref_name }}
# End of main-branch image build workflow.
