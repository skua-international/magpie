name: Build and push images

# Push-triggered on every main push for regular commit builds. Main keeps
# the fast branch/sha/latest images flowing; release tags are handled by a
# separate tag-only workflow so the promotion step cannot be filtered away
# by path rules here.
#
# Nothing here depends on generated/go or generated/ts (only cli/magpie
# and a future website would) -- crates/protocol's build.rs shells out to
# protoc directly against proto/ at `cargo build` time, so every service
# image here regenerates its own Rust bindings fresh on every build
# regardless of whether release.yml has run yet. That's what makes
# triggering directly off a monorepo-wide main push safe at all.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/skua-international/magpie

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  # Compiles all 6 service binaries once, natively (no Docker involved),
  # and hands them to the build matrix below as a job artifact. This
  # replaced a cargo-chef multi-stage build duplicated across all 6
  # Dockerfiles after it caused two separate real caching bugs in one
  # session: a -p-scoping mismatch between `cook` and the final build that
  # silently defeated the cache even on a cook hit, and a cache-scope race
  # across the 6 services' concurrent matrix builds where one service's
  # planner stage imported a stale recipe.json from a different commit.
  # Compiling once, outside Docker, removes both failure classes outright
  # -- there's no cross-job Docker cache to race on, and Swatinem/rust-cache
  # (actions/cache, keyed on Cargo.lock, already reliable elsewhere in this
  # repo) replaces what cargo-chef was for.
  build-workspace:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    # Compiling on the bare runner links against *its* glibc, which is
    # newer than the Debian 12 (bookworm) base every final image uses --
    # confirmed live: a runner-compiled binary failed with "GLIBC_2.39
    # not found" inside debian:bookworm-slim/distroless-cc-debian12
    # (glibc 2.36). Building inside this container instead matches the
    # runtime images' own glibc; GHA handles workspace/cache mounting for
    # every step below transparently, no manual `docker run` plumbing
    # needed.
    container:
      image: rust:bookworm
    steps:
      - uses: actions/checkout@v7

      # crates/protocol's build.rs shells out to a real protoc binary (via
      # connectrpc-build) at `cargo build` time for every workspace member.
      - name: Install protoc
        run: apt-get update && apt-get install -y --no-install-recommends protobuf-compiler

      - uses: Swatinem/rust-cache@v2

      - name: Build all service binaries
        run: cargo build --release --locked

      - name: Collect binaries
        run: |
          mkdir -p dist
          for bin in launcher sync-daemon controller registry server-api identity volume-manager; do
            cp "target/release/${bin}" "dist/${bin}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: magpie-binaries
          path: dist/
          # Only ever consumed by the `build` job in this same workflow
          # run -- no reason to keep it around after that.
          retention-days: 1

  build:
    needs: [pick-runner, build-workspace]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: launcher
            dockerfile: services/launcher/Dockerfile
          - name: sync-daemon
            dockerfile: services/sync-daemon/Dockerfile
          - name: controller
            dockerfile: services/controller/Dockerfile
          - name: registry
            dockerfile: services/registry/Dockerfile
          - name: server-api
            dockerfile: services/server-api/Dockerfile
          - name: identity
            dockerfile: services/identity/Dockerfile
          - name: volume-manager
            dockerfile: services/volume-manager/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          name: magpie-binaries
          path: dist/

      # Main-branch pushes produce branch/sha/latest images only; tag
      # promotion is done by the separate tag-only workflow.
      - name: Resolve version
        id: version
        run: echo "version=$(grep '^version:' charts/magpie/Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=,format=short

      # All Dockerfiles build from the repo root (COPY dist/<bin> --
      # dist/ is the artifact build-workspace produced above), not from
      # their own service directory. No cargo/Docker cache here at all
      # any more -- these Dockerfiles are just COPY + a handful of apt
      # packages now, cheap enough that caching isn't worth the
      # complexity it kept causing.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
# End of main-branch image build workflow.
