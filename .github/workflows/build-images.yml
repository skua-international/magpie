name: Build and push images

# Push-triggered on every main push for regular commit builds. Main keeps
# the fast branch/sha/latest images flowing; release tags are handled by a
# separate tag-only workflow so the promotion step cannot be filtered away
# by path rules here.
#
# Nothing here depends on generated/go or generated/ts (only cli/magpie
# and a future website would) -- crates/protocol's build.rs shells out to
# protoc directly against proto/ at `cargo build` time, so every service
# image here regenerates its own Rust bindings fresh on every build
# regardless of whether release.yml has run yet. That's what makes
# triggering directly off a monorepo-wide main push safe at all.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/skua-international/magpie

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  # Compiles all 6 service binaries once, natively (no Docker involved),
  # and hands them to the build matrix below as a job artifact. This
  # replaced a cargo-chef multi-stage build duplicated across all 6
  # Dockerfiles after it caused two separate real caching bugs in one
  # session: a -p-scoping mismatch between `cook` and the final build that
  # silently defeated the cache even on a cook hit, and a cache-scope race
  # across the 6 services' concurrent matrix builds where one service's
  # planner stage imported a stale recipe.json from a different commit.
  # Compiling once, outside Docker, removes both failure classes outright
  # -- there's no cross-job Docker cache to race on, and Swatinem/rust-cache
  # (actions/cache, keyed on Cargo.lock, already reliable elsewhere in this
  # repo) replaces what cargo-chef was for.
  build-workspace:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    # No `container:` here -- tried that first (rust:bookworm, matching
    # the Debian 12/glibc 2.36 runtime images), but it broke on elephant
    # specifically: elephant's runner mounts the *host's* Docker socket
    # (Docker-outside-of-Docker), and a `container:` job needs the runner
    # to bind-mount its own /actions-runner/externals (Node.js binaries
    # for running JS-based actions like checkout) into the spun-up job
    # container -- but that bind-mount source path only exists inside the
    # runner's own container filesystem, not on the actual host elephant's
    # dockerd sees. Confirmed live: checkout inside the container failed
    # with "/__e/node24/bin/node: no such file or directory" even with a
    # guaranteed-fresh runner image (real node24 binaries confirmed
    # present in the image, just not reachable through that mount from
    # the host's perspective). This isn't fixable by a fresher image or
    # runner version -- it's structural to socket-mounted DooD.
    #
    # Building natively on the bare runner instead works out because
    # elephant's runner happens to be Ubuntu 20.04 (glibc 2.31) --
    # *older* than bookworm's glibc 2.36, so a binary built there runs
    # fine on bookworm (glibc is backward-compatible: older-linked runs
    # on newer, not the other way around -- confirmed live, this is
    # exactly backwards from the original problem, where a too-new local
    # sandbox glibc broke the same binaries). This does NOT hold if this
    # job ever falls back to ubuntu-latest (24.04, glibc 2.39 -- newer
    # than bookworm, the original problem) -- pick-runner only falls back
    # when elephant is fully offline, a real but lower-probability case
    # this doesn't currently handle. Revisit (e.g. a musl target, which
    # sidesteps glibc-matching entirely) if that fallback path actually
    # gets exercised.
    steps:
      - uses: actions/checkout@v7

      # crates/protocol's build.rs shells out to a real protoc binary (via
      # connectrpc-build) at `cargo build` time for every workspace member.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build all service binaries
        run: cargo build --release --locked

      - name: Collect binaries
        run: |
          mkdir -p dist
          for bin in launcher sync-daemon controller registry server-api identity volume-manager; do
            cp "target/release/${bin}" "dist/${bin}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: magpie-binaries
          path: dist/
          # Only ever consumed by the `build` job in this same workflow
          # run -- no reason to keep it around after that.
          retention-days: 1

  build:
    needs: [pick-runner, build-workspace]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: launcher
            dockerfile: services/launcher/Dockerfile
          - name: sync-daemon
            dockerfile: services/sync-daemon/Dockerfile
          - name: controller
            dockerfile: services/controller/Dockerfile
          - name: registry
            dockerfile: services/registry/Dockerfile
          - name: server-api
            dockerfile: services/server-api/Dockerfile
          - name: identity
            dockerfile: services/identity/Dockerfile
          - name: volume-manager
            dockerfile: services/volume-manager/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          name: magpie-binaries
          path: dist/

      # Main-branch pushes produce branch/sha/latest images only; tag
      # promotion is done by the separate tag-only workflow.
      - name: Resolve version
        id: version
        run: echo "version=$(grep '^version:' charts/magpie/Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=,format=short

      # All Dockerfiles build from the repo root (COPY dist/<bin> --
      # dist/ is the artifact build-workspace produced above), not from
      # their own service directory. No cargo/Docker cache here at all
      # any more -- these Dockerfiles are just COPY + a handful of apt
      # packages now, cheap enough that caching isn't worth the
      # complexity it kept causing.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
# End of main-branch image build workflow.
