name: Release

# Manually dispatched, deliberately: commits build+push images/binaries
# on every push to main (build-images.yml / build-cli-binaries.yml), all
# addressable by commit SHA, all the time -- that part needs no gate.
# This workflow is a separate, explicit "promote a specific commit to a
# real release" action: point it at a ref (default: main's current HEAD),
# and if semantic-release finds a conventional-commit reason to, it tags
# that exact commit and cuts a GitHub Release, no new commit and no new
# build involved. Downstream, publish-release-artifacts.yml/release-cli.yml
# (both tag-triggered) then retag/republish the already-built SHA-tagged
# images/chart/binaries under the new semver tag.
#
# Trusts whoever dispatches this to only do so once build-images.yml /
# build-cli-binaries.yml have already gone green for the chosen ref --
# deliberately no wait/poll for that here. Chaining off workflow_run used
# to do this automatically, but was inherently racy under rapid-fire
# pushes (a superseded build never triggers a release at all via
# cancel-in-progress, a slow release run can finish after a newer commit
# has already landed, etc.) -- a human picking the moment is simpler and
# actually correct.
#
# Regenerating generated/go + generated/ts still happens in this same job
# so we can reject a release if the checked-in stubs are stale, but
# nothing is committed here -- semantic-release's config has no git/exec
# plugin, so the tag lands directly on the chosen commit, not on some new
# bump commit. Requires the Skua International GitHub App to be installed
# on this repo with Contents: Read & Write, and its APP_ID/APP_PRIVATE_KEY
# set as repo secrets (see skua-armory's .github/RELEASING.md for how the
# App itself was registered -- it's already installed org-wide, this repo
# just needs the secrets). The App token matters, not just convenience: a
# tag/release created with the default GITHUB_TOKEN does NOT trigger other
# workflows' `on: push: tags` triggers, which is exactly what needs to
# happen here to get publish-release-artifacts.yml/release-cli.yml to run.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit-ish to release (default: main's current HEAD)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  release:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    permissions:
      contents: write
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # semantic-release walks commit history back to the last tag;
          # buf breaking (below) diffs against the last release tag.
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ steps.app-token.outputs.token }}

      # Cache key for the @latest plugin installs below -- ISO week, so
      # the cache self-refreshes periodically instead of pinning forever
      # to whatever was first cached.
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.71.0"
          # Unauthenticated: buf-setup-action's own GitHub API calls (to
          # fetch the release asset) hit the anonymous, much lower rate
          # limit otherwise. The default GITHUB_TOKEN is enough for this
          # -- it's just downloading a public release, not touching this
          # repo -- no need for the App token here.
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Diffs against the last release tag, not the previous commit --
      # "would this release break consumers of the last one", which is
      # the question that actually matters at promotion time. Skipped if
      # there's no prior release tag yet. A failure here stops the job
      # before anything is regenerated or released.
      - name: Check for breaking proto changes
        run: |
          if last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
            buf breaking proto --against ".git#ref=${last_tag},subdir=proto"
          else
            echo "No prior release tag found, skipping breaking-change check."
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Same reasoning as generate-stubs.yml's own copy of this
          # comment: only go installs third-party tools here, no local
          # go.mod to key setup-go's built-in cache off at all.
          cache: false

      # Keyed by ISO week, not a fixed key: these are @latest installs
      # (no version pin, matching buf.gen.yaml's own `local:` plugins), so
      # the cache still self-refreshes periodically instead of pinning
      # forever to whatever was first cached.
      - name: Cache Go proto plugins
        id: cache-go-plugins
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: protoc-plugins-go-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: protoc-plugins-go-${{ runner.os }}-

      - name: Install Go plugins
        if: steps.cache-go-plugins.outputs.cache-hit != 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Cache TypeScript proto plugin
        id: cache-ts-plugin
        uses: actions/cache@v6
        with:
          path: /tmp/ts-plugin
          key: protoc-plugins-ts-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: protoc-plugins-ts-${{ runner.os }}-

      - name: Install TypeScript plugin
        if: steps.cache-ts-plugin.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/ts-plugin
          npm install --prefix /tmp/ts-plugin @bufbuild/protoc-gen-es@latest
      - run: echo "/tmp/ts-plugin/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Regenerate proto stubs
        run: buf generate proto

      - name: Verify generated stubs are current
        run: git diff --exit-code -- generated/go generated/ts

      - run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release
