name: Release CLI binaries

# Tag-triggered, not chained off release.yml the way build-images used to
# be -- release.yml's own tag (created via the App token, see its own
# comment on why that matters) already IS the trigger here; no ordering
# race to worry about since there's only ever one push that creates a
# given tag, unlike main's branch head which can move again shortly
# after.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build binaries for (defaults to the ref this is dispatched against)"
        required: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # Only uploading assets to a release semantic-release already
      # created -- the default token's contents:write is enough, no need
      # for the App token this repo also has (that's reserved for actions
      # that need to *create* tags/pushes that re-trigger other workflows).
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: cli/magpie
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds crates/steam-sync's steam-login companion binary
  # (cli/magpie/internal/steamlogin downloads this on first use of
  # `magpie admin refresh-steam-auth`) for the same 5 targets magpie
  # itself ships for, uploaded to the same release under a naming
  # convention (steam-login_<os>_<arch>[.exe]) that package matches
  # exactly against runtime.GOOS/GOARCH, no translation table needed.
  #
  # One native runner per OS rather than cross-compiling everything from
  # a single Linux runner: macOS targets build with their platform's own
  # real toolchain (no osxcross setup), and the only actual cross-
  # compilation here is linux/arm64 from an amd64 runner, which just
  # needs a cross-linker apt already has a package for.
  #
  # Windows target included since steamdepot@2986921 -- crates/steam-sync's
  # pinned git dependency used to use Unix-only APIs unconditionally in
  # download.rs (confirmed via a real failed build here, not a guess),
  # which meant the whole crate failed to compile for Windows at all.
  # Fixed upstream (we own that fork): FileExt::read_at ->
  # a cfg-gated read_at()/seek_read() wrapper, PermissionsExt::from_mode
  # cfg(unix)-gated outright (no Windows equivalent to translate the
  # executable bit to), tokio::fs::symlink -> symlink_file on Windows.
  steam-login:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: steam-login_linux_amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: steam-login_linux_arm64
            cross-linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: steam-login_darwin_amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: steam-login_darwin_arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: steam-login_windows_amd64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: arduino/setup-protoc@v3
        with:
          # crates/protocol's build.rs shells out to a real protoc binary
          # (via connectrpc-build) -- every crate in the workspace builds
          # through cargo-chef-equivalent resolution, so steam-login needs
          # this too even though it doesn't itself touch proto/.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # No Docker layers here (unlike build-images.yml's services --
      # steam-login is a plain cross-compiled binary), so the same
      # cargo-chef-layer-sharing trick doesn't apply -- this is what
      # actually caches ~/.cargo/registry + target/ across runs instead.
      # Keys itself on Cargo.lock + the job matrix (target/os), so the 5
      # legs don't stomp on each other's cache entries.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: steam-login-${{ matrix.target }}

      - name: Install cross-linker
        if: matrix.cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross-linker }}
        run: cargo build --release -p steam-sync --bin steam-login --target ${{ matrix.target }}

      - name: Rename and upload
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/steam-login"
          [[ "${{ matrix.os }}" == windows-latest ]] && src="${src}.exe"
          cp "$src" "${{ matrix.asset }}"
          gh release upload "${{ inputs.tag || github.ref_name }}" "${{ matrix.asset }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
