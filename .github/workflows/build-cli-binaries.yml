name: Build CLI binaries

# Main-branch pushes build snapshot CLI binaries for validation. Publishing
# remains tag-only in release-cli.yml; this workflow never uploads release
# assets. In the monorepo model, every main push rebuilds every artifact
# family so nothing depends on path-filtered trigger coverage.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-cli-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --clean --snapshot
          workdir: cli/magpie