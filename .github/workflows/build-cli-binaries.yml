name: Build CLI binaries

# Main-branch pushes build snapshot CLI binaries for validation. Publishing
# remains tag-only in release-cli.yml; this workflow never uploads release
# assets. In the monorepo model, every main push rebuilds every artifact
# family so nothing depends on path-filtered trigger coverage.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-cli-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  goreleaser:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          # go.mod/go.sum live at cli/magpie/, not the repo root -- setup-go's
          # built-in cache only auto-detects a root-level go.sum, otherwise
          # silently skipping caching with just a warning.
          cache-dependency-path: cli/magpie/go.sum

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --clean --snapshot
          workdir: cli/magpie