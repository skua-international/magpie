name: Generate proto stubs (manual)

# Manual-only: regenerates generated/go + generated/ts from proto/ and
# commits the result to main, without cutting a release. For checking in
# a regen between releases (e.g. to unblock a consumer) without waiting
# for the next conventional-commit-driven release.
#
# The push-triggered version of this now lives inside release.yml itself
# (as a step before semantic-release runs) rather than here -- both this
# workflow and release.yml used to fire independently off the same
# proto-touching push, and if release.yml's job won that race it would
# tag a release with stale stubs. See release.yml's own comment.
#
# Committed as plain github-actions[bot] (default GITHUB_TOKEN), not the
# Skua International GitHub App -- nothing downstream needs this specific
# commit to trigger another workflow.

on:
  workflow_dispatch: {}

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  generate:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.71.0"
          # Tried migrating to the consolidated bufbuild/buf-action (with
          # setup_only: true) -- confirmed broken on this repo's
          # self-hosted runner (see pick-runner.yml): its core.addPath()
          # call runs (logged "Setup buf (1.71.0) at
          # /opt/hostedtoolcache/buf/..."), but the very next step still
          # gets "buf: command not found", and buf-action's own post-job
          # cleanup step then fails the same way trying to find buf
          # itself. Unclear whether that's a buf-action bug or a quirk of
          # this runner's PATH-file handling; reverted to buf-setup-action
          # (proven working, same install pattern) rather than debug it
          # further this session.


      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Only `go install`s third-party tools here (protoc-gen-go/
          # protoc-gen-connect-go), not building against any local go.mod
          # -- there's no dependency file for setup-go's built-in cache to
          # key off at all, so leaving it enabled just produces the same
          # "Dependencies file is not found" warning every run for
          # nothing.
          cache: false

      - name: Install Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Installed to a scratch prefix, not the repo root -- generated/ts
      # has its own package.json (the *output* package's runtime deps,
      # @bufbuild/protobuf + @connectrpc/connect), which is unrelated to
      # this plugin install and shouldn't end up with a node_modules/
      # lockfile dropped next to it.
      - name: Install TypeScript plugin
        run: |
          mkdir -p /tmp/ts-plugin
          npm install --prefix /tmp/ts-plugin @bufbuild/protoc-gen-es@latest
          echo "/tmp/ts-plugin/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Generate
        run: buf generate proto

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add generated/
          if git diff --cached --quiet; then
            echo "No changes to generated stubs."
            exit 0
          fi
          git commit -m "chore(proto): regenerate go/ts stubs"
          git push origin HEAD:main
