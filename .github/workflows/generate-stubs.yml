name: Generate proto stubs (manual)

# Manual-only: regenerates generated/go + generated/ts from proto/ and
# commits the result to main, without cutting a release. For checking in
# a regen between releases (e.g. to unblock a consumer) without waiting
# for the next conventional-commit-driven release.
#
# The push-triggered version of this now lives inside release.yml itself
# (as a step before semantic-release runs) rather than here -- both this
# workflow and release.yml used to fire independently off the same
# proto-touching push, and if release.yml's job won that race it would
# tag a release with stale stubs. See release.yml's own comment.
#
# Committed as plain github-actions[bot] (default GITHUB_TOKEN), not the
# Skua International GitHub App -- nothing downstream needs this specific
# commit to trigger another workflow.

on:
  workflow_dispatch: {}

env:
  PROTOC_GEN_GO_VERSION: v1.36.12
  PROTOC_GEN_CONNECT_GO_VERSION: v1.20.0

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.71.0"
          # buf-setup-action rather than the consolidated
          # bufbuild/buf-action. Migrating was tried once and reverted:
          # buf-action's core.addPath() ran but the next step still got
          # "buf: command not found". That was diagnosed against a
          # self-hosted ARC runner and may well have been specific to its
          # PATH-file handling, so it is worth retrying now that this runs
          # on ubuntu-latest -- see issue #30, which tracks exactly that.


      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Only `go install`s third-party tools here (protoc-gen-go/
          # protoc-gen-connect-go), not building against any local go.mod
          # -- there's no dependency file for setup-go's built-in cache to
          # key off at all, so leaving it enabled just produces the same
          # "Dependencies file is not found" warning every run for
          # nothing.
          cache: false

      # Pinned to the same versions as release.yml's env block -- see the
      # comment there for why @latest breaks its staleness check.
      - name: Install Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@${PROTOC_GEN_CONNECT_GO_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # protoc-gen-es from the root package-lock.json. The workspace
      # install hoists everything to the root node_modules/, so nothing
      # lands next to generated/ts's own package.json.
      - name: Install TypeScript plugin
        run: |
          npm ci
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Generate
        run: buf generate proto

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add generated/
          if git diff --cached --quiet; then
            echo "No changes to generated stubs."
            exit 0
          fi
          git commit -m "chore(proto): regenerate go/ts stubs"
          git push origin HEAD:main
