[package]
name = "controller"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
observability = { path = "../../crates/observability" }
opentelemetry = "0.32.0"
anyhow = "1.0.103"
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
crd = { path = "../../crates/crd" }
futures = "0.3.32"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.0.0", features = ["runtime", "derive"] }
registry-db = { path = "../../crates/registry-db" }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
sync-client = { path = "../../crates/sync-client" }
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7"] }
