[package]
name = "launcher"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal"] }
anyhow = "1"
libc = "0.2"
regex = "1"
sync-client = { path = "../../crates/sync-client" }
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
