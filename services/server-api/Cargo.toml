[package]
name = "server-api"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.103"
authn = { version = "0.1.0", path = "../../crates/authn" }
axum = "0.8.9"
buffa = "0.8.1"
connectrpc = { version = "0.8.1", features = ["axum"] }
crd = { version = "0.1.0", path = "../../crates/crd" }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.0.0", features = ["derive"] }
protocol = { version = "0.1.0", path = "../../crates/protocol" }
registry-db = { version = "0.1.0", path = "../../crates/registry-db" }
serde_json = "1.0.150"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros"] }
sync-client = { version = "0.1.0", path = "../../crates/sync-client" }
tokio = { version = "1.53.0", features = ["full"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v7"] }
