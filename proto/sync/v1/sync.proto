syntax = "proto3";
package sync.v1;

option go_package = "github.com/skua-international/magpie/generated/go/sync/v1;syncv1";

// Mod/collection sync registry and content-claim service. Owns all Steam
// depot/workshop mechanics -- callers (the controller) never talk to Steam
// directly, only in terms of candidate IDs and resolved mod IDs.
service SyncService {
  // Resolve `candidate_ids` (each may be an individual mod or a collection
  // -- the caller doesn't need to know which) and register them as a named
  // source in the persistent sync registry. Registering an existing
  // source_id again refreshes its membership (diffed against what was
  // previously registered) rather than erroring -- this is also how a
  // source is first created, there is no separate "create" call.
  rpc RegisterSource(RegisterSourceRequest) returns (RegisterSourceResponse);

  // Explicitly stop tracking a source. Deliberately not tied to any
  // consumer's lifecycle (e.g. a game server being deleted) -- content may
  // be worth keeping synced ("chambered") even with nothing currently
  // using it. Only removes this source_id's membership; a mod still
  // referenced by another source keeps syncing.
  rpc DeregisterSource(DeregisterSourceRequest) returns (DeregisterSourceResponse);

  // Downloads server/CDLC depots plus every currently-registered
  // source's resolved mods into the shared golden content tree --
  // fire-and-forget (returns immediately, doesn't wait for the sync to
  // finish, which can range from instant (warm cache) to minutes
  // (cold)). No completion signal is returned at all -- the caller's
  // real interest is "make sure this eventually happens", not knowing
  // exactly when; GetSyncStats/ListSyncedMods reflect the result once
  // it's done. Every ArmaServer's own content comes from a read-only
  // btrfs snapshot of this tree instead (services/magpie-csi's
  // NodeStageVolume, mode: snapshot -- not this service's concern at
  // all anymore).
  rpc SyncContent(SyncContentRequest) returns (SyncContentResponse);

  // Read a previously-registered source's current resolved mod list
  // without re-registering it (no candidate IDs needed, no Steam calls --
  // a plain read of what RegisterSource/the background poller last
  // resolved). Used by the controller's reconciler to build a server's
  // own -mod= args from the source IDs its spec references.
  rpc GetSourceMods(GetSourceModsRequest) returns (GetSourceModsResponse);

  // Re-resolve a single already-registered source against its
  // originally-registered candidate IDs (stored from the last
  // RegisterSource call) -- the same work the background poller does
  // periodically for every source, triggered on demand for one source
  // instead of waiting for the next poll tick. Used by the controller's
  // UpdateServer/StartServer RPCs ("force resync this server's mod
  // sources") -- callers don't need to remember/resupply candidate IDs.
  rpc RefreshSource(RefreshSourceRequest) returns (RefreshSourceResponse);

  // Every workshop mod ID currently tracked as verified-synced, and the
  // manifest_id it was last verified at. A plain read of the sync cache --
  // no Steam calls, no depot state (server/CDLC depots aren't included,
  // only workshop mods).
  rpc ListSyncedMods(ListSyncedModsRequest) returns (ListSyncedModsResponse);

  // Clear one mod's "last verified" marker only -- never deletes its files
  // on disk. The next resolve pass genuinely re-verifies that mod's chunks
  // against Steam's current manifest, redownloading only whatever's
  // actually missing or divergent. Deliberately not a real
  // wipe-and-redownload -- this is the restricted, non-destructive shape
  // of "force refresh a mod's cache".
  rpc InvalidateMod(InvalidateModRequest) returns (InvalidateModResponse);

  // A single mod's synced state plus every source_id currently
  // referencing it -- one extra query beyond ListSyncedMods, so kept
  // separate rather than having every list entry pay for it.
  rpc GetSyncedMod(GetSyncedModRequest) returns (GetSyncedModResponse);

  // Cluster-wide totals: every synced mod's size deduplicated across
  // sources, plus base game/CDLC depot size -- for registry's
  // AdminService.GetDiskUsage.
  rpc GetSyncStats(GetSyncStatsRequest) returns (GetSyncStatsResponse);

  // Establish (or replace) this cluster's Steam session from an
  // already-negotiated refresh token -- the interactive username+password
  // (+ Guard code) negotiation itself never happens inside this or any
  // other deployed service; it happens client-side, in
  // cli/magpie's `magpie admin refresh-steam-auth` (which runs the
  // Steam login flow client-side, then calls this RPC with just the
  // result). A password reaching this
  // process, even transiently, is exactly what this RPC shape is
  // designed to make impossible. On success, the new session is persisted
  // and this process exits to pick it up fresh on restart (see the
  // handler's own doc for why) -- the response still reaches the caller
  // first.
  rpc RefreshSteamAuth(RefreshSteamAuthRequest) returns (RefreshSteamAuthResponse);

  // QR-code login negotiated here rather than by the client. Begin
  // opens a Steam CM connection and returns its challenge URL; Poll
  // waits for the mobile app to confirm and then installs the session,
  // exactly as RefreshSteamAuth would have with a client-negotiated
  // token.
  //
  // The session between the two calls holds that live CM connection, so
  // it is held in-process and both calls must land on the same replica
  // -- see the deployment's own replica note. Same constraint
  // services/identity already carries for its exchange-code map.
  rpc BeginQrLogin(BeginQrLoginRequest) returns (BeginQrLoginResponse);
  rpc PollQrLogin(PollQrLoginRequest) returns (PollQrLoginResponse);

  // Whether the golden content tree is safe to snapshot from right now --
  // the controller polls this before creating an ArmaServer's Deployment
  // so a launcher Pod never gets a CSI snapshot of a base-game/CDLC sync
  // that's still mid-download (confirmed live: a server started against a
  // partial sync fails to even spawn arma3server_x64, "Permission denied",
  // since steamcmd doesn't set the binary's final mode/content until its
  // download actually completes). Deliberately not folded into
  // GetSyncStats -- that reports totals regardless of whether a sync is
  // currently touching them, this reports the one boolean the controller
  // actually needs to gate on.
  rpc GetSyncStatus(GetSyncStatusRequest) returns (GetSyncStatusResponse);
}

message ListSyncedModsRequest {}

message SyncedMod {
  uint64 mod_id = 1;
  uint64 manifest_id = 2;
  uint64 size_bytes = 3;
  // Empty if this mod was resolved (RegisterSource/RefreshSource/the
  // background poller) before this process last restarted -- titles
  // aren't independently persisted across restarts yet, only learned
  // fresh from Steam each time a mod is actually resolved.
  string title = 4;
}

message ListSyncedModsResponse {
  repeated SyncedMod mods = 1;
}

message GetSyncedModRequest {
  uint64 mod_id = 1;
}

message GetSyncedModResponse {
  // Unset if mod_id isn't currently tracked as synced at all.
  optional SyncedMod mod = 1;
  repeated string source_ids = 2;
}

message GetSyncStatsRequest {}

message GetSyncStatsResponse {
  // Every currently-synced workshop mod's on-disk size, counted exactly
  // once regardless of how many sources reference it -- `synced` is keyed
  // by mod, not by source.
  uint64 mods_bytes = 1;
  // Base game + selected CDLC depot content on disk (not mod content).
  uint64 game_files_bytes = 2;
}

message RefreshSteamAuthRequest {
  string username = 1;
  // Already negotiated client-side (see the RPC's own doc) -- this
  // process never sees a password, only ever this.
  string refresh_token = 2;
}

message RefreshSteamAuthResponse {}

message InvalidateModRequest {
  uint64 mod_id = 1;
}

message InvalidateModResponse {}

message RefreshSourceRequest {
  string source_id = 1;
}

message RefreshSourceResponse {
  repeated ResolvedMod mods = 1;
}

message GetSourceModsRequest {
  string source_id = 1;
}

message GetSourceModsResponse {
  repeated uint64 mod_ids = 1;
}

message RegisterSourceRequest {
  repeated uint64 candidate_ids = 1;
  string source_id = 2;
}

// A single resolved workshop item (a collection's candidate ID never
// appears here directly -- only what it expands to).
message ResolvedMod {
  uint64 mod_id = 1;
  string title = 2;
}

message RegisterSourceResponse {
  // The fully-resolved, flat mod list for this source specifically
  // (collections expanded) -- for the caller to build e.g. a game
  // server's own -mod= launch args.
  repeated ResolvedMod mods = 1;
  // The originally-requested candidate's own Workshop title (a single
  // mod's title, or a collection's title -- collections carry their own
  // `title` even though `children` is what actually gets expanded into
  // `mods`). Only populated when `candidate_ids` had exactly one entry;
  // empty for multi-candidate sources (e.g. a preset HTML export), where
  // no single title makes sense.
  string root_title = 2;
}

message DeregisterSourceRequest {
  string source_id = 1;
}

message DeregisterSourceResponse {}

message SyncContentRequest {}

message SyncContentResponse {}

message GetSyncStatusRequest {}

message GetSyncStatusResponse {
  // True while any sync_content pass (RPC-triggered, the reconciler's
  // auto-sync-on-first-resolve, or the startup sync) is actually running.
  bool syncing = 1;
  // True once the base game/CDLC depots have been synced at least once --
  // false both before the very first sync and while game_files_bytes'
  // last-known content isn't actually complete yet (i.e. while syncing is
  // also true and this is still the first sync ever). A server with this
  // false has no arma3server_x64 to run at all yet, regardless of syncing.
  bool game_files_ready = 2;
}

message BeginQrLoginRequest {}

message BeginQrLoginResponse {
  string session_id = 1;
  string challenge_url = 2;
}

message PollQrLoginRequest {
  string session_id = 1;
}

message PollQrLoginResponse {
  bool confirmed = 1;
  string username = 2;
}
