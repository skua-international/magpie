syntax = "proto3";
package registry.v1;

option go_package = "github.com/skua-international/magpie/generated/go/registry/v1;registryv1";

// Every RPC in this file requires a `Bearer <JWT>` verified against a
// configured JWKS endpoint; authorization is scope + subject based against
// a Postgres-backed grant table shared with services/controller (see
// crates/authn) -- there is no unauthenticated path. JWTs are issued by a
// separate identity service (OpenID-linked-to-OAuth2), not by this API.

// Registers and tracks *sources* of mods -- a single Workshop mod, a
// Workshop collection, or a locally-uploaded zip -- independent of any
// server's lifecycle. A server references zero or more mod sources by ID;
// deleting a server does not delete the sources it referenced (content may
// be worth keeping synced/stored with nothing currently using it).
service ModSourceService {
  rpc AddModSource(AddModSourceRequest) returns (AddModSourceResponse);
  rpc DeleteModSource(DeleteModSourceRequest) returns (DeleteModSourceResponse);
  rpc ListModSources(ListModSourcesRequest) returns (ListModSourcesResponse);

  // Force one source to be re-resolved and a claim job started covering
  // the full current desired state -- doesn't wait for the claim to
  // finish, same fire-and-forget shape as sync-daemon's own Claim(). Same
  // scope as AddModSource: this is a relatively harmless operation
  // (re-resolve + sync whatever's actually desired, nothing destructive).
  rpc SyncModSource(SyncModSourceRequest) returns (SyncModSourceResponse);

  // Every workshop mod ID currently tracked as verified-synced, and the
  // manifest_id it was last verified at -- independent of any source
  // (a mod can outlive/predate the source that first pulled it in).
  rpc ListSyncedMods(ListSyncedModsRequest) returns (ListSyncedModsResponse);

  // Clear one mod's verification cache only -- never deletes its files.
  // The next sync genuinely re-verifies it against Steam's current
  // manifest, redownloading only whatever's actually missing or
  // divergent. Deliberately not real file deletion (see the RPC's own
  // restricted scope, distinct from mod-sources:write) -- a mod can be
  // shared by other sources or by servers currently running content
  // claimed from it, and a claim is its own independent copy that's never
  // touched by anything done to the shared golden tree afterward.
  rpc InvalidateMod(InvalidateModRequest) returns (InvalidateModResponse);

  // A single mod's synced state (title, on-disk size) plus every mod
  // source currently referencing it.
  rpc GetSyncedMod(GetSyncedModRequest) returns (GetSyncedModResponse);
}

message AddModSourceRequest {
  oneof source {
    // A URL to a preset HTML export -- fetched and scanned for
    // `filedetails/?id=` links.
    string html_url = 1;
    // The preset HTML export's content itself, already in hand -- scanned
    // directly, no fetch.
    string html_content = 2;
    // A single raw Steam Workshop URL -- a mod or a collection,
    // indistinguishable by shape alone. sync-daemon resolves the actual
    // type via its authenticated Steam session.
    string steam_url = 3;
    LocalModUpload local_mod = 4;
  }
}

message LocalModUpload {
  // Caller-assigned identifier for this local mod, unique among all local
  // mods -- used as its on-disk directory name and its stable reference in
  // ListModSources, since local mods have no Steam ID of their own.
  string unique_id = 1;
  // A .zip archive containing the mod, with mod.cpp (or mod.cpp inside a
  // single top-level folder) at its root.
  bytes zip_content = 2;
}

message AddModSourceResponse {
  string id = 1;
}

message DeleteModSourceRequest {
  string id = 1;
}

message DeleteModSourceResponse {}

message SyncModSourceRequest {
  string id = 1;
}

message SyncModSourceResponse {}

message ListSyncedModsRequest {}

message SyncedMod {
  uint64 mod_id = 1;
  uint64 manifest_id = 2;
  uint64 size_bytes = 3;
  // Empty if this mod hasn't been resolved (RegisterSource/RefreshSource/
  // the background poller) since sync-daemon last restarted.
  string title = 4;
}

message ListSyncedModsResponse {
  repeated SyncedMod mods = 1;
}

message InvalidateModRequest {
  uint64 mod_id = 1;
}

message InvalidateModResponse {}

message GetSyncedModRequest {
  uint64 mod_id = 1;
}

message GetSyncedModResponse {
  // Unset if mod_id isn't currently tracked as synced at all.
  optional SyncedMod mod = 1;
  repeated ModSourceInfo mod_sources = 2;
}

enum ModSourceKind {
  MOD_SOURCE_KIND_UNSPECIFIED = 0;
  MOD_SOURCE_KIND_MOD = 1;
  MOD_SOURCE_KIND_COLLECTION = 2;
  MOD_SOURCE_KIND_LOCAL = 3;
  // Registered from a preset HTML export (URL or inline content) --
  // resolves to however many mod IDs the preset listed, with no single
  // Workshop item/collection identity of its own.
  MOD_SOURCE_KIND_PRESET = 4;
}

message ModSourceInfo {
  string id = 1;
  ModSourceKind kind = 2;
  // The Steam Workshop URL (mod/collection kinds) or unique_id (local
  // kind) this source was registered with.
  string reference = 3;
  // Workshop display name for mod/collection kinds, captured once at
  // registration time (not kept fresh against later Workshop edits).
  // Empty for local kind and for multi-mod HTML-preset sources, where no
  // single title applies.
  string display_name = 4;
  int64 created_at_unix_ms = 5;
  // Sum of on-disk size across every mod this source currently resolves
  // to (local kind: the extracted zip's own directory size). A mod shared
  // by more than one source counts fully toward each -- unlike
  // GetDiskUsage's cluster-wide total, this is "how much does *this
  // source* need", not a deduplicated figure.
  uint64 size_bytes = 6;
}

message ListModSourcesRequest {}

message ListModSourcesResponse {
  repeated ModSourceInfo sources = 1;
}

// Mission (.pbo) storage. Missions are not server-scoped -- every uploaded
// mission is mounted read-only into every server Pod, same as a shared
// mod source but for mission files instead of addons.
service MissionService {
  rpc UploadMission(UploadMissionRequest) returns (MissionInfo);
  rpc GetMission(GetMissionRequest) returns (MissionInfo);
  rpc ListMissions(ListMissionsRequest) returns (ListMissionsResponse);
  rpc DeleteMission(DeleteMissionRequest) returns (DeleteMissionResponse);
}

message UploadMissionRequest {
  // Original filename, e.g. "my_mission.altis.pbo".
  string name = 1;
  bytes pbo_content = 2;
  // If set, overwrite the existing mission with this ID in place instead
  // of creating a new one -- `name`/`pbo_content` replace the stored
  // values, `id`/`created_at`/`created_by` are unchanged.
  optional string id = 3;
}

message MissionInfo {
  string id = 1;
  string name = 2;
  uint64 filesize = 3;
  int64 created_at_unix_ms = 4;
  // Subject (JWT `sub` claim) of whoever uploaded (or last overwrote) this
  // mission.
  string created_by = 5;
}

message GetMissionRequest {
  string id = 1;
}

message ListMissionsRequest {}

message ListMissionsResponse {
  repeated MissionInfo missions = 1;
}

// Cluster-wide storage accounting, spanning both mod content (owned by
// sync-daemon for Steam-backed sources, this service's own storage for
// local ones) and missions (this service's own storage) -- the one place
// that answers "how much disk is all of this actually using" as a single
// figure, rather than callers having to sum ModSourceInfo.size_bytes
// themselves (which double-counts any mod shared by more than one
// source).
service AdminService {
  rpc GetDiskUsage(GetDiskUsageRequest) returns (GetDiskUsageResponse);

  // Establish (or replace) the cluster's Steam session from an
  // already-negotiated refresh token -- proxies straight to sync-daemon's
  // own RPC of the same name (see its doc for the full rationale on why
  // the interactive username+password negotiation itself happens
  // client-side, never here). Its own scope, deliberately separate from
  // and more restricted than anything else here -- this can authenticate
  // as the Steam account.
  rpc RefreshSteamAuth(RefreshSteamAuthRequest) returns (RefreshSteamAuthResponse);

  // Everything declarative about this cluster's Arma fleet: mod source
  // registrations (not their synced file content -- see
  // ExportedModSource's own doc), the ConfigMaps servers reference (the
  // baseline plus every per-server override), and ArmaServer specs.
  // Deliberately excludes Postgres application data, synced mod/mission
  // file content, ACL grants, and any live credential (Steam session,
  // linked OAuth accounts) -- none of that is "declarative config" in
  // the same sense, and copying live credentials between clusters is
  // its own hazard rather than a convenience.
  rpc ExportState(ExportStateRequest) returns (ExportStateResponse);

  // Re-creates whatever ExportState produced. Idempotent per item, not
  // transactional: each mod source/ConfigMap/server is applied
  // independently, and one failing doesn't roll back the others -- the
  // response's `warnings` reports exactly what was skipped and why.
  // Servers are matched to their mod sources by `reference` (the
  // original Steam/preset URL), never by ID -- ModSource IDs are
  // regenerated on every import and never match the export's own.
  rpc ImportState(ImportStateRequest) returns (ImportStateResponse);
}

enum ExportedDesiredState {
  EXPORTED_DESIRED_STATE_UNSPECIFIED = 0;
  EXPORTED_DESIRED_STATE_RUNNING = 1;
  EXPORTED_DESIRED_STATE_STOPPED = 2;
}

message ExportedModSource {
  ModSourceKind kind = 1;
  // Reusable on import for MOD/COLLECTION (a Steam URL) and PRESET
  // registered from a URL -- ImportState re-registers these directly
  // against a fresh ModSource object. Empty (well, literally
  // "(uploaded HTML)") for PRESET registered from inline HTML content --
  // see resolved_mod_ids below for how that case is still reconstructed.
  string reference = 2;
  string display_name = 3;
  // PRESET sources registered from inline HTML content (reference ==
  // "(uploaded HTML)") have no URL to re-register from, but a preset is
  // ultimately just a list of mod IDs either way -- workshop_parse scans
  // raw text for `filedetails/?id=<n>` links regardless of markup, so
  // this is exactly what it already extracted from the original content
  // at resolve time (ModSourceStatus.resolved_mod_ids). ImportState
  // synthesizes equivalent minimal HTML content from this list and
  // registers *that*, rather than skipping -- reconstructs the same mod
  // set even though the original markup itself was never captured.
  // Empty (and thus still skipped, with a warning) only for a source
  // that was never actually resolved before export, or for LOCAL, whose
  // actual zip content was never part of this export at all.
  repeated uint64 resolved_mod_ids = 4;
}

message ExportedConfigMap {
  string name = 1;
  map<string, string> data = 2;
}

message ExportedServer {
  string name = 1;
  uint32 port = 2;
  // ExportedModSource.reference strings this server's mod_source_ids
  // resolved to at export time -- not IDs, see ImportState's own doc.
  repeated string mod_source_references = 3;
  optional string config_map = 4;
  repeated string cdlc = 5;
  bool profiling = 6;
  repeated string params = 7;
  ExportedDesiredState desired_state = 8;
  // Mirrors ArmaServerSpec.metrics -- see its own doc.
  optional uint32 metrics_port = 9;
  optional string metrics_path = 10;
}

message ExportStateRequest {}

message ExportStateResponse {
  string exported_at_rfc3339 = 1;
  repeated ExportedModSource mod_sources = 2;
  repeated ExportedConfigMap config_maps = 3;
  repeated ExportedServer servers = 4;
  // E.g. a server referencing a mod source ID that no longer resolves
  // (deleted between the mod source list and server list reads) --
  // dropped from that server's mod_source_references rather than
  // failing the whole export.
  repeated string warnings = 5;
}

message ImportStateRequest {
  repeated ExportedModSource mod_sources = 1;
  repeated ExportedConfigMap config_maps = 2;
  repeated ExportedServer servers = 3;
}

message ImportStateResponse {
  repeated string warnings = 1;
}

message GetDiskUsageRequest {}

message GetDiskUsageResponse {
  // Every currently-synced workshop mod's on-disk size, counted exactly
  // once regardless of how many mod sources reference it.
  uint64 mods_bytes = 1;
  // Every uploaded mission's stored file size.
  uint64 missions_bytes = 2;
  // Base game + selected CDLC depot content (not mod/mission content).
  uint64 game_files_bytes = 3;
  uint64 total_bytes = 4;
}

message RefreshSteamAuthRequest {
  string username = 1;
  string refresh_token = 2;
}

message RefreshSteamAuthResponse {}

message DeleteMissionRequest {
  string id = 1;
}

message DeleteMissionResponse {}
