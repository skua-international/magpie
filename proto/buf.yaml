version: v2
modules:
  - path: .
breaking:
  use:
    - FILE
  # volume/v1 was removed outright (volume-manager's bespoke Connect-RPC
  # API replaced by magpie-csi, a real CSI driver speaking plain gRPC
  # instead -- see README.md's "magpie-csi" bullet) -- a deliberate,
  # already-shipped removal, not something `buf breaking` should keep
  # flagging against every future release tag that still has it in
  # history. Ignored in both directions, so it also doesn't error if a
  # tag before the removal is ever diffed against.
  #
  # controller/v1: CreateServerRequest/ServerInfo's arma_config/
  # network_config fields removed -- they only ever let a caller pick a
  # filename under configs/, but arma_config.rs (the controller's own
  # renderer) always writes exactly main.cfg/basic.cfg regardless, so a
  # non-default filename silently pointed the launcher at a file that was
  # never actually written. Fields are `reserved`, not reused.
  #
  # registry/v1: ModSourceKind's MOD_SOURCE_KIND_GAME_FILES = 5 added and
  # then removed again in the same short-lived change -- surfacing game
  # files as a selectable ModSource let the create-server picker store
  # its synthetic id in mod_source_ids, which the controller then tried
  # to fetch as a real CR and 404'd on. Never shipped in a real release;
  # nothing depends on it.
  ignore:
    - volume
    - controller
    - registry
