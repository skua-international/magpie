version: v2
# Rust stubs are NOT generated here -- connectrpc-build (crates/protocol's
# build.rs) already generates them as part of `cargo build` itself, and
# there's no working standalone protoc plugin for it yet upstream
# (protoc-gen-connect-rust on crates.io is a v0.0.1 placeholder, "coming
# soon from Buf", not functional). Go and TypeScript have no equivalent
# in-repo generation, so those are what this generates and commits (see
# .github/workflows/generate-stubs.yml).
plugins:
  - local: protoc-gen-go
    out: generated/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: generated/go
    opt: paths=source_relative
  # protoc-gen-es v2 generates service descriptors (GenService) directly
  # alongside message types in one file -- @connectrpc/connect's
  # createClient() consumes that descriptor directly, no separate
  # connect-es plugin exists/is needed anymore (the old
  # @connectrpc/protoc-gen-connect-es is stuck at v1.7.0, superseded).
  - local: protoc-gen-es
    out: generated/ts
    opt:
      - target=ts
