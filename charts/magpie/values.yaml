# image.tag is the shared default tag for every service unless overridden
# per-service; image.repository is only a fallback base (each service is a
# genuinely different image, not a different tag of one image -- see each
# section's own image.repository default below, which is what actually
# gets used unless you override it). Images are built and pushed to GHCR
# by .github/workflows/build-images.yml on every push to main that
# touches something build-relevant, tagged with (among others) the exact
# version from this same Chart.yaml -- see that workflow's "Resolve
# version" step.
#
# Left empty here rather than "latest": the chart's own image helper
# (_helpers.tpl's magpie.image) falls back to .Chart.AppVersion when this
# is unset, so a plain `helm install`/`upgrade` at chart version X.Y.Z
# deploys images tagged X.Y.Z by default -- reproducible by construction,
# not whatever happens to be `latest` on the registry at that moment. Set
# this explicitly (or use scripts/deploy.sh's version argument) to pin to
# something else, e.g. a specific commit's short-sha tag.
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# Names of existing docker-registry Secrets granting pull access, e.g. to
# GHCR if the images live in a private repo/package (the default,
# ghcr.io/skua-international/magpie/*, does). Not created by this chart --
# kubectl create secret docker-registry <name> --docker-server=ghcr.io
# --docker-username=<user> --docker-password=<a token with read:packages>
# ahead of `helm install`.
imagePullSecrets: []

# Image the controller's reconciler tells k8s to run for each ArmaServer's
# launcher Pod. Not deployed by this chart itself -- just referenced.
launcherImage: ghcr.io/skua-international/magpie/launcher:latest

# Every resource this chart creates lands here, regardless of what
# namespace `helm install`/`upgrade` itself was invoked with -- a plain
# `helm install arma charts/magpie` (no -n flag) can never accidentally
# dump everything into `default`. The chart creates this namespace itself
# (templates/namespace.yaml); `helm uninstall` still cleans it up
# correctly regardless, since Helm tracks exactly what it created, not
# just what's in the invoking namespace.
namespace: magpie

# services/server-api, services/identity, and services/registry are
# ClusterIP-only -- reached from outside the cluster via the Ingress
# resources this chart also creates (see ingress.* below), fronted by
# k3s's own bundled Traefik. Deliberately not hostPort: a Deployment that
# binds a port on the node itself can never do a zero-downtime
# RollingUpdate on a single-node target (the new Pod can't schedule until
# the old one, still holding that port, is gone) -- confirmed live, this
# caused a stuck rollout. Traefik/klipper-lb already solves "reachable
# from one stable address" correctly and isn't something this chart has
# to manage the rollout of itself. Game server ports are unaffected --
# ArmaServer launcher Pods use hostNetwork with their own real game
# ports directly, which is a different, deliberate exception (see
# reconcile.rs).
ingress:
  enabled: true
  className: traefik
  # Each service gets its own hostname: <service>.<baseDomain>. No real
  # DNS needed for a single-node target -- point these at the node's own
  # IP via /etc/hosts (or real DNS, if you have it) on whatever machine
  # needs to reach them.
  baseDomain: magpie.local

# Node-local directories backing every shared volume in this chart --
# hostPath, deliberately not PVCs. This whole chart targets single-node
# k3s (see deploy/k3s-bootstrap.sh); on one node, "multiple pods need to
# read/write the same volume concurrently" doesn't require a real
# RWX-capable storage class (NFS, Longhorn, ...) at all, since every pod
# is already on that one node -- hostPath already allows unlimited
# concurrent mounts with zero extra infrastructure. It's also the
# *correct* choice, not just the simplest one: contentPath and claimsPath
# must be on the very same real filesystem for sync-daemon's reflink
# claims to work (`cp --reflink=always` can't CoW across filesystems) --
# an NFS-backed RWX PVC would silently degrade every claim to a slow real
# copy instead. All three default under one parent directory so that's
# true without the operator having to think about it; if you move any of
# these, keep contentPath and claimsPath together on one filesystem.
hostPaths:
  contentPath: /var/lib/magpie/content
  claimsPath: /var/lib/magpie/claims
  localContentPath: /var/lib/magpie/local-content

# JWT verification config, shared by services/registry and
# services/server-api (which verify tokens) and services/identity (which
# issues them) -- all three need to agree on issuer/audience for anything
# to work. jwksUrl defaults to this chart's own services/identity if left
# empty; only set it if you're pointing at a different issuer than the one
# this chart deploys.
jwt:
  jwksUrl: ""
  issuer: "magpie"
  audience: "magpie"

# OAuth2/OpenID identity broker: Discord/GitHub/Google login (OAuth2) and
# Steam login (OpenID 2.0 -- Valve never adopted OIDC), linkable to one
# internal identity, issuing the JWTs everything else in this chart
# verifies. The very first person to ever sign in is automatically granted
# every scope (acl_grants: ['*']) -- there's no admin UI to hand out
# permissions any other way yet, so the first login becomes the operator
# by convention. Holds the cluster's only JWT signing key (generated on
# first boot, persisted in Postgres) and every OAuth2 client secret --
# treat its RBAC/network exposure with the most care of anything here (it
# has none of the former: never touches the Kubernetes API at all).
identity:
  image:
    repository: "ghcr.io/skua-international/magpie/identity"
    tag: ""
  service:
    type: ClusterIP
    port: 8445
  # This service's externally-reachable base URL, no trailing slash --
  # used to build OAuth2 redirect_uri values and Steam's OpenID realm.
  # Unlike everything else in this chart, whoever's browser completes a
  # login needs to reach this, so it generally can't just be an in-cluster
  # DNS name -- required.
  baseUrl: ""
  # Name of an existing Secret holding OAuth2 app credentials as
  # <PROVIDER>_CLIENT_ID / <PROVIDER>_CLIENT_SECRET keys (e.g.
  # DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, GITHUB_CLIENT_ID, ...). A
  # provider is enabled only if both its keys are present -- none are
  # required, since Steam login needs no app registration/credentials at
  # all (OpenID 2.0). Not created by this chart. Optional: leave empty to
  # run with Steam-only login.
  oauthSecret: ""
  resources: {}

# The cluster's single shared Postgres instance -- mod sources, missions,
# and the ACL grant table (see crates/registry-db) all live in one
# database, read/written by services/registry, services/server-api, and
# services/controller (read-only, for resolving mod source kind/reference).
postgres:
  # Chart-managed: a single-replica StatefulSet + PVC, bundled here like
  # every other component. Set enabled: false and fill in externalUrl to
  # point at a Postgres you already run instead.
  enabled: true
  image: postgres:16-alpine
  port: 56275
  database: arma
  user: arma
  # Name of an existing Secret with a POSTGRES_PASSWORD key. Not created by
  # this chart -- `kubectl create secret generic <name>
  # --from-literal=POSTGRES_PASSWORD=...` ahead of `helm install`, so the
  # password never lives in values.yaml.
  existingSecret: ""
  storage:
    className: ""
    size: 10Gi
  # Binds Postgres to 127.0.0.1:5432 on the node itself (hostPort, loopback
  # only) -- reachable from the host for admin tools/backups, never from
  # the network. Only meaningful with postgres.enabled: true.
  exposeOnHost: true
  # Used instead of the chart-managed StatefulSet when postgres.enabled is
  # false. Full connection string, e.g.
  # postgres://user:pass@host:5432/dbname.
  externalUrl: ""
  resources: {}

syncDaemon:
  # SQLite is a single-writer store -- never raise this.
  replicas: 1
  pollIntervalSecs: 1800
  poolSize: 4
  image:
    repository: "ghcr.io/skua-international/magpie/sync-daemon"
    tag: ""
  steamAuth:
    # Anonymous Steam login (no credentials) -- fine for public workshop
    # content, not for private/unlisted mods or collections.
    anonymous: false
    # There is deliberately no "existing Secret with STEAM_USER/
    # STEAM_PASSWORD" option -- a Steam password should never reach a
    # deployed service, not even via a Secret-sourced env var. Establish
    # a session with `magpie admin refresh-steam-auth` instead: the
    # interactive login happens entirely client-side (on the operator's
    # own machine), and only the resulting refresh token -- revocable
    # independent of the account's real password -- ever reaches the
    # cluster, via the AdminService.RefreshSteamAuth RPC (see its own doc).
    # This chart creates a Secret by this name, empty, so sync-daemon's
    # own RBAC can be scoped to get/patch on one specific pre-existing
    # object (Kubernetes RBAC's resourceNames can't restrict a create
    # verb at all, since there's no object name to check yet -- see
    # secrets.rs's own doc). sync-daemon fills it in itself once a
    # session exists (from existingSecret at first boot, or a later
    # RefreshSteamAuth call) and reads from it on every subsequent boot,
    # skipping credentials entirely once it has one.
    sessionSecretName: arma-steam-session
  resources: {}

# Reconciler only -- watches ArmaServer, creates/deletes launcher
# Deployments. No external listener, no auth surface; the only thing that
# talks to it is the Kubernetes API itself (services/server-api writes
# ArmaServer objects, this reads them).
controller:
  image:
    repository: "ghcr.io/skua-international/magpie/controller"
    tag: ""
  # Namespace ArmaServer resources and their Deployments are managed in.
  # Defaults to the release namespace when empty. Must match
  # serverApi.namespace.
  namespace: ""
  # Host directory (hostPath-mounted per-ArmaServer as
  # <serverRootBase>/<name>) holding each server's own operator-provided
  # content -- configs/profiles/keys. Not Steam-synced, not tied to any
  # claim's lifecycle.
  serverRootBase: /srv/arma-servers
  resources: {}

# JWT-authenticated ArmaServer CRUD + lifecycle (Create/Start/Stop/Update).
# Deliberately carries the least Kubernetes RBAC of anything in this chart
# (ArmaServer read/write only, no Deployment access) -- this is the one
# process a compromised bearer token gets to talk to directly.
serverApi:
  image:
    repository: "ghcr.io/skua-international/magpie/server-api"
    tag: ""
  namespace: ""
  service:
    type: ClusterIP
    port: 8443
  resources: {}

# JWT-authenticated mod source registry (ModSourceService) + mission
# storage (MissionService). No Kubernetes RBAC at all -- doesn't touch the
# k8s API, only Postgres and the localContent volume.
registry:
  image:
    repository: "ghcr.io/skua-international/magpie/registry"
    tag: ""
  service:
    type: ClusterIP
    port: 8444
  resources: {}

rbac:
  create: true
