# image.tag is the shared default tag for every service unless overridden
# per-service; image.repository is only a fallback base (each service is a
# genuinely different image, not a different tag of one image -- see each
# section's own image.repository default below, which is what actually
# gets used unless you override it). Images are built and pushed to GHCR
# by .github/workflows/build-images.yml on every push to main that
# touches something build-relevant, tagged with (among others) the exact
# version from this same Chart.yaml -- see that workflow's "Resolve
# version" step.
#
# Left empty here rather than "latest": the chart's own image helper
# (_helpers.tpl's magpie.image) falls back to .Chart.AppVersion when this
# is unset, so a plain `helm install`/`upgrade` at chart version X.Y.Z
# deploys images tagged X.Y.Z by default -- reproducible by construction,
# not whatever happens to be `latest` on the registry at that moment. Set
# this explicitly (or use scripts/deploy.sh's version argument) to pin to
# something else, e.g. a specific commit's short-sha tag.
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# Names of existing docker-registry Secrets granting pull access, e.g. to
# GHCR if the images live in a private repo/package (the default,
# ghcr.io/skua-international/magpie/*, does). Not created by this chart --
# kubectl create secret docker-registry <name> --docker-server=ghcr.io
# --docker-username=<user> --docker-password=<a token with read:packages>
# ahead of `helm install`.
imagePullSecrets: []

# Image the controller's reconciler tells k8s to run for each ArmaServer's
# launcher Pod. Not deployed by this chart itself -- just referenced, via
# the same magpie.image helper every other service's own image uses (see
# controller-deployment.yaml's LAUNCHER_IMAGE env var) -- tag defaults to
# image.tag/Chart.AppVersion, same as everything else, rather than
# hardcoding :latest. That distinction actually matters here: the
# controller explicitly sets every launcher Pod's imagePullPolicy to
# IfNotPresent (see reconcile.rs's own comment) specifically because a
# real version tag is expected to be immutable -- :latest broke that
# assumption, confirmed live (a launcher Pod kept running an old cached
# binary indefinitely across reinstalls, since the tag string itself
# never changed).
launcherImage:
  repository: "ghcr.io/skua-international/magpie/launcher"
  tag: ""

# Every resource this chart creates lands here, regardless of what
# namespace `helm install`/`upgrade` itself was invoked with -- a plain
# `helm install arma charts/magpie` (no -n flag) can never accidentally
# dump everything into `default`. The chart creates this namespace itself
# (templates/namespace.yaml); `helm uninstall` still cleans it up
# correctly regardless, since Helm tracks exactly what it created, not
# just what's in the invoking namespace.
namespace: magpie

# Dedicated namespace for Secrets an operator wants referenceable from
# Arma config ConfigMaps via {{secret:<name>/<key>}} -- see the "Arma
# server config" section of README.md. Chart-created (templates/
# user-secrets-namespace.yaml), kept separate from `namespace` above so
# the controller's cross-namespace read access can be scoped to just
# this namespace, not the one holding magpie-postgres-creds/
# ghcr-pull-secret/etc.
userSecretsNamespace: magpie-user-secrets

# services/server-api, services/identity, and services/registry are
# ClusterIP-only -- reached from outside the cluster via the Ingress
# resources this chart also creates (see ingress.* below), fronted by
# k3s's own bundled Traefik. Deliberately not hostPort: a Deployment that
# binds a port on the node itself can never do a zero-downtime
# RollingUpdate on a single-node target (the new Pod can't schedule until
# the old one, still holding that port, is gone) -- confirmed live, this
# caused a stuck rollout. Traefik/klipper-lb already solves "reachable
# from one stable address" correctly and isn't something this chart has
# to manage the rollout of itself. Game server ports are unaffected --
# ArmaServer launcher Pods use hostNetwork with their own real game
# ports directly, which is a different, deliberate exception (see
# reconcile.rs).
ingress:
  enabled: true
  className: traefik
  # Each service gets its own hostname: <service>.<baseDomain>. No real
  # DNS needed for a single-node target -- point these at the node's own
  # IP via /etc/hosts (or real DNS, if you have it) on whatever machine
  # needs to reach them.
  baseDomain: magpie.local
  tls:
    # Off by default -- the local magpie.local flow above has no real
    # cert to get anyway. A real public deployment (a cert-manager
    # ClusterIssuer already installed cluster-wide, e.g. by a sibling
    # infra chart) sets this true and names that issuer; each Ingress
    # above then gets the cert-manager.io/cluster-issuer annotation and
    # its own TLS secret.
    enabled: false
    clusterIssuer: letsencrypt-prod
  # Per-service opt-in label for an external-dns install using a
  # matching --label-filter (e.g. --source=ingress
  # --label-filter=external-dns.skua.io/expose=true) -- the label
  # alone does nothing without that; this chart never installs
  # external-dns itself. A map, not one shared toggle: not every
  # service necessarily needs public DNS reachability (e.g. one meant
  # for internal/VPN-only access), so each of the three Ingresses this
  # chart creates opts in independently. All off by default -- inert
  # for any deployment that never wires up external-dns at all.
  dns:
    labelKey: external-dns.skua.io/expose
    labelValue: "true"
    services:
      identity: false
      registry: false
      server-api: false

# sync-daemon's golden content tree lives on a PersistentVolumeClaim
# against the magpie-golden-content StorageClass (see
# golden-content-storageclass.yaml and services/magpie-csi). Every
# ArmaServer's own content comes from a CSI inline ephemeral volume
# instead (no separate StorageClass/PVC/size setting -- it's a fresh
# read-only btrfs snapshot of this same tree, taken on demand). magpie-
# csi's own Node plugin loop-mounts a growable btrfs blob for this
# regardless of what filesystem the host itself actually has -- see its
# own doc for why that's still necessary even though this isn't hostPath
# any more.
reflinkStorage:
  sizeGiB: 40

# Node-local directory holding registry-owned local (zip-uploaded) mods
# and missions -- hostPath, not a PVC: this chart targets single-node
# k3s (see deploy/k3s-bootstrap.sh), so "multiple pods need to read/write
# the same volume concurrently" doesn't need a real RWX-capable storage
# class, and there's no reflink/same-filesystem requirement here the way
# there is for sync-daemon's content/claims above.
#
# Must already exist, owned by 65532:65532 (distroless nonroot's fixed
# UID/GID, what registry's own container runs as) before this Deployment
# starts -- kubelet's own `DirectoryOrCreate` creates it root:root
# otherwise, and hostPath is one of the volume types fsGroup doesn't
# recursively chown (PVC/emptyDir only), so the container's first write
# would EACCES. `magpiectl install --bootstrap-k3s` does this for you
# automatically; a manually-provisioned host needs `mkdir -p` + `chown
# 65532:65532` run once ahead of time instead (deliberately not solved
# with a privileged initContainer in-cluster -- see git history for why
# that approach was tried and reverted).
hostPaths:
  localContentPath: /var/lib/magpie/local-content

# JWT verification config, shared by services/registry and
# services/server-api (which verify tokens) and services/identity (which
# issues them) -- all three need to agree on issuer/audience for anything
# to work. jwksUrl defaults to this chart's own services/identity if left
# empty; only set it if you're pointing at a different issuer than the one
# this chart deploys.
jwt:
  jwksUrl: ""
  issuer: "magpie"
  audience: "magpie"

# OAuth2/OpenID identity broker: Discord/GitHub/Google login (OAuth2) and
# Steam login (OpenID 2.0 -- Valve never adopted OIDC), linkable to one
# internal identity, issuing the JWTs everything else in this chart
# verifies. The very first person to ever sign in is automatically granted
# every scope (acl_grants: ['*']) -- there's no admin UI to hand out
# permissions any other way yet, so the first login becomes the operator
# by convention. Holds the cluster's only JWT signing key (generated on
# first boot, persisted in Postgres) and every OAuth2 client secret --
# treat its RBAC/network exposure with the most care of anything here (it
# has none of the former: never touches the Kubernetes API at all).
identity:
  image:
    repository: "ghcr.io/skua-international/magpie/identity"
    tag: ""
  service:
    type: ClusterIP
    port: 8445
  # This service's externally-reachable base URL, no trailing slash --
  # used to build OAuth2 redirect_uri values and Steam's OpenID realm.
  # Unlike everything else in this chart, whoever's browser completes a
  # login needs to reach this, so it generally can't just be an in-cluster
  # DNS name -- required.
  baseUrl: ""
  # Name of an existing Secret holding OAuth2 app credentials as
  # <PROVIDER>_CLIENT_ID / <PROVIDER>_CLIENT_SECRET keys (e.g.
  # DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, GITHUB_CLIENT_ID, ...). A
  # provider is enabled only if both its keys are present -- none are
  # required, since Steam login needs no app registration/credentials at
  # all (OpenID 2.0). Not created by this chart. Optional: leave empty to
  # run with Steam-only login.
  oauthSecret: ""
  resources: {}

# The cluster's single shared Postgres instance -- mod sources, missions,
# and the ACL grant table (see crates/registry-db) all live in one
# database, read/written by services/registry, services/server-api, and
# services/controller (read-only, for resolving mod source kind/reference).
postgres:
  # Chart-managed: a single-replica StatefulSet + PVC, bundled here like
  # every other component. Set enabled: false and either fill in
  # existingSecret (preferred -- see below) or externalUrl to point at
  # a Postgres you already run instead.
  enabled: true
  image: postgres:18-alpine
  port: 56275
  database: magpie-cluster
  user: magpie-operator
  # Name of an existing Secret with a POSTGRES_PASSWORD key. Not created by
  # this chart -- `kubectl create secret generic <name>
  # --from-literal=POSTGRES_PASSWORD=...` ahead of `helm install`, so the
  # password never lives in values.yaml. Required when postgres.enabled is
  # true; when it's false, setting this too (paired with host/port/user/
  # database below) is the preferred way to point at an external Postgres
  # -- DATABASE_URL gets composed the same $(PGPASSWORD)-from-Secret way
  # either way, resolved at pod-start time, so nothing ever needs to read
  # a password back out and pass it as a literal Helm value. externalUrl
  # below is the fallback for callers that would rather pass one
  # connection string than a Secret reference.
  existingSecret: ""
  storage:
    className: ""
    size: 10Gi
  # Binds Postgres to 127.0.0.1:5432 on the node itself (hostPort, loopback
  # only) -- reachable from the host for admin tools/backups, never from
  # the network. Only meaningful with postgres.enabled: true.
  exposeOnHost: true
  # Used instead of the chart-managed StatefulSet when postgres.enabled is
  # false AND existingSecret is left empty. Full connection string, e.g.
  # postgres://user:pass@host:5432/dbname.
  externalUrl: ""
  # A discrete host, paired with the port/database/user fields above --
  # required whenever postgres.enabled is false, regardless of whether
  # existingSecret or externalUrl is what actually supplies the password.
  # Needed alongside externalUrl (rather than parsing it apart) because
  # the launcher's DATABASE_HOST/PORT/USER/PASSWORD/NAME env vars
  # (consumed by whatever Arma-side extension the launcher process runs,
  # see postgres_bootstrap.rs) need discrete values, not one connection
  # URL.
  host: ""
  # Role name for the technical Postgres user launcher's Arma process
  # itself connects as -- separate from postgres.user (magpie's own Rust
  # services) so the two never share privileges. The controller
  # provisions this role itself on startup (CREATE ROLE + GRANT CONNECT,
  # CREATE ON DATABASE only, REVOKE ALL ON SCHEMA public) -- it never
  # gets access to anything magpie's own services already own.
  # Provisioned even when postgres.enabled is false, against whatever
  # externalUrl points at.
  appUser: magpie-operator-arma
  # See templates/app-postgres-secret.yaml -- created by the chart
  # itself (stable across upgrades), read by the controller for the
  # plaintext password it needs to run the SQL above.
  appSecretName: magpie-app-postgres-creds
  resources: {}

syncDaemon:
  # SQLite is a single-writer store -- never raise this.
  replicas: 1
  pollIntervalSecs: 1800
  # How often to passively re-download/re-verify already-synced content
  # on a timer, on top of the explicit triggers (SyncModSource RPC, a
  # server starting, a ModSource's first resolve) -- catches upstream
  # depot/mod updates for content nothing has explicitly touched in a
  # while. 0 disables this timer (every sync stays purely
  # trigger-driven).
  contentSyncIntervalSecs: 21600
  poolSize: 4
  image:
    repository: "ghcr.io/skua-international/magpie/sync-daemon"
    tag: ""
  steamAuth:
    # Anonymous Steam login (no credentials) -- confirmed live: this can
    # sync already-public workshop mods (not private/unlisted ones), but
    # can NEVER sync the base game or CDLC depots at all. Steam's
    # RequestFreeLicense (what makes the free Arma 3 Dedicated Server
    # depot downloadable without actually owning Arma 3) is explicitly
    # refused for anonymous sessions ("Not for anonymous users" from
    # steamcmd's own app_license_request) -- only a real, logged-in
    # account works for that, and it doesn't need to own Arma 3 either,
    # just not be anonymous. So: fine for warming/testing workshop mod
    # syncing in isolation, but a real deployment (anything that needs
    # to actually launch a server) always needs a real account via
    # `magpiectl admin refresh-steam-auth`, regardless of this setting.
    anonymous: false
    # There is deliberately no "existing Secret with STEAM_USER/
    # STEAM_PASSWORD" option -- a Steam password should never reach a
    # deployed service, not even via a Secret-sourced env var. Establish
    # a session with `magpie admin refresh-steam-auth` instead: the
    # interactive login happens entirely client-side (on the operator's
    # own machine), and only the resulting refresh token -- revocable
    # independent of the account's real password -- ever reaches the
    # cluster, via the AdminService.RefreshSteamAuth RPC (see its own doc).
    # This chart creates a Secret by this name, empty, so sync-daemon's
    # own RBAC can be scoped to get/patch on one specific pre-existing
    # object (Kubernetes RBAC's resourceNames can't restrict a create
    # verb at all, since there's no object name to check yet -- see
    # secrets.rs's own doc). sync-daemon fills it in itself once a
    # session exists (from existingSecret at first boot, or a later
    # RefreshSteamAuth call) and reads from it on every subsequent boot,
    # skipping credentials entirely once it has one.
    sessionSecretName: arma-steam-session
  resources: {}

# Reconciler only -- watches ArmaServer, creates/deletes launcher
# Deployments. No external listener, no auth surface; the only thing that
# talks to it is the Kubernetes API itself (services/server-api writes
# ArmaServer objects, this reads them).
controller:
  image:
    repository: "ghcr.io/skua-international/magpie/controller"
    tag: ""
  # Namespace ArmaServer resources and their Deployments are managed in.
  # Defaults to the release namespace when empty. Must match
  # serverApi.namespace.
  namespace: ""
  # Host directory (hostPath-mounted per-ArmaServer as
  # <serverRootBase>/<name>) holding each server's own operator-provided
  # content -- configs/profiles/keys. Not Steam-synced, not tied to any
  # claim's lifecycle.
  #
  # Same 65532:65532-ownership prerequisite as hostPaths.localContentPath
  # above -- see that comment for why. `magpiectl install --bootstrap-k3s`
  # handles this one too.
  serverRootBase: /srv/arma-servers
  resources: {}

# JWT-authenticated ArmaServer CRUD + lifecycle (Create/Start/Stop/Update).
# Deliberately carries the least Kubernetes RBAC of anything in this chart
# (ArmaServer read/write only, no Deployment access) -- this is the one
# process a compromised bearer token gets to talk to directly.
serverApi:
  image:
    repository: "ghcr.io/skua-international/magpie/server-api"
    tag: ""
  namespace: ""
  service:
    type: ClusterIP
    port: 8443
  resources: {}

# JWT-authenticated mod source registry (ModSourceService) + mission
# storage (MissionService). No Kubernetes RBAC at all -- doesn't touch the
# k8s API, only Postgres and the localContent volume.
registry:
  image:
    repository: "ghcr.io/skua-international/magpie/registry"
    tag: ""
  service:
    type: ClusterIP
    port: 8444
  resources: {}

# Node-local privileged blob/filesystem lifecycle -- see
# proto/volume/v1/volume.proto and hostPaths' own comment above for why
# this exists. runAsUser/runAsGroup have no default: `magpiectl install`
# provisions the magpie-volume system user/group on the host and sets
# these via --set (see cli/magpie/internal/deploy/volumeuser.go) --
# there's no sensible generic default UID/GID to ship here, and shipping
# a wrong one silently would be worse than the chart refusing to render
# without it (see the DaemonSet template's own `required`).
# services/magpie-csi -- one binary, deployed twice (see
# magpie-csi-controller-deployment.yaml/magpie-csi-node-daemonset.yaml):
# once as the CSI Controller service (CreateVolume/DeleteVolume, paired
# with the standard external-provisioner sidecar) and once as the CSI
# Node service (NodeStageVolume/NodePublishVolume, one per node, paired
# with the standard node-driver-registrar sidecar). See its own README/
# doc comments for why this replaced volume-manager's bespoke RPC design.
magpieCsi:
  image:
    repository: "ghcr.io/skua-international/magpie/magpie-csi"
    tag: ""
  # kubelet's own root-dir -- the Kubernetes default (/var/lib/kubelet)
  # only applies if kubelet was never told otherwise. `magpiectl install
  # --bootstrap-k3s` relocates it (--kubelet-arg=root-dir=<data-dir>/
  # kubelet, see cli/magpie/internal/deploy/bootstrap.go) and passes the
  # matching value here automatically -- confirmed live, this needs to
  # be exactly right or node-driver-registrar registers into a path
  # kubelet never actually watches, and CSI mounts fail with "driver
  # name ... not found in the list of registered CSI drivers" despite
  # the Node plugin itself running fine. Set this by hand if you're
  # deploying onto a cluster this chart didn't bootstrap itself and its
  # kubelet root-dir isn't the k8s default either.
  kubeletDir: /var/lib/kubelet
  resources: {}

# Cluster-wide baseline Arma server config -- every ArmaServer's own
# main.cfg/basic.cfg starts here (rendered into templates/arma-config-
# baseline-configmap.yaml); a server's own spec.configMap, if set, layers
# per-server overrides on top, key-by-key. See services/controller/src/
# arma_config.rs and README's "Arma server config" section for the full
# placeholder/{{secret:...}}/env.* mechanism this feeds.
armaConfig:
  main:
    # Empty means "use the computed default": "{{prefix}}{{server_name}}{{suffix}}".
    hostname: ""
    prefix: ""
    suffix: " | Powered by MAGPIE"
    maxPlayers: 64
    forceDifficulty: false
    forcedDifficulty: veteran
    missionsWhitelist: []
    persistWithoutPlayers: false
    useBattlEye: false
    verifySignatures: true
    skipLobby: false
    # 0/1/2, matching Arma's own allowedFilePatching values directly.
    allowedFilePatching: 1
    disableVON: true
    # (level, seconds) pairs -- old-fleet default. An empty list renders
    # as kickTimeout[] = {} (kicks disabled), same as any other empty
    # list field here.
    kickTimeout:
      - level: 0
        seconds: 1
      - level: 1
        seconds: 1
      - level: 2
        seconds: 1
      - level: 3
        seconds: 1
    allowZeusCompositionScripts: true
    allowCustomGlasses: false
    maxPing: 300
    # Unset (not 0) by default -- omitted from the rendered main.cfg entirely.
    maxPacketLoss: ""
    maxDesync: ""
    passwordAdmin: ""
    password: ""
    serverCommandPassword: ""
    motd: []
    motdInterval: ""
    # -limitFPS= -- a launch flag, not main.cfg content (render_main_cfg
    # never touches it), resolved from this same merged ConfigMap purely
    # because that's the one place "configure this server" already means.
    limitFps: 300
    # Extra launch args, appended verbatim after the generated -mod=/CDLC
    # ones -- the ConfigMap-driven replacement for the old per-server
    # spec.params field (removed: this is the single source of truth for
    # extra flags now, cluster-wide via this default or per-server via
    # spec.configMap, same as every other field here). Old-fleet default:
    # load missions from memory (faster mission start) and bandwidth
    # algorithm 2 (Arma's own newer/recommended congestion control).
    additionalParams: "-loadMissionToMemory -bandwidthAlg=2"
    # Raw text appended verbatim at the end of main.cfg. Defaults to the
    # old fleet's own allowed*Extensions[] lists (issue #25) -- a sane
    # cluster-level default, not typed/per-server-overridable fields of
    # their own, but still just this same escape hatch underneath, so
    # overriding it (per-server via spec.configMap, or cluster-wide by
    # setting this value directly) works exactly like overriding any
    # other otherProperties content would.
    otherProperties: |-
      allowedLoadFileExtensions[] = {"h","hpp","sqs","sqf","fsm","cpp","paa","txt","xml","inc","ext","sqm","ods","fxy","lip","csv","kb","bik","bikb","html","htm","biedi","b64"};
      allowedPreprocessFileExtensions[] = {"h","hpp","sqs","sqf","fsm","cpp","paa","txt","xml","inc","ext","sqm","ods","fxy","lip","csv","kb","bik","bikb","html","htm","biedi"};
      allowedHTMLLoadExtensions[] = {"htm","html","xml","txt"};
  # All fields here default unset (not 0), omitted entirely when unset --
  # matches basic.cfg's own convention of only setting what you mean to.
  basic:
    maxMsgSend: ""
    maxSizeGuaranteed: ""
    maxSizeNonguaranteed: ""
    minBandwidth: ""
    maxBandwidth: ""
    minErrorToSend: ""
    minErrorToSendNear: ""
    # Raw text appended verbatim at the end of basic.cfg.
    otherProperties: ""

rbac:
  create: true
