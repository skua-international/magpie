apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: armaservers.arma.skua.io
spec:
  group: arma.skua.io
  names:
    categories: []
    kind: ArmaServer
    plural: armaservers
    shortNames:
    - arma
    singular: armaserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ArmaServerSpec via `CustomResource`
        properties:
          spec:
            description: |-
              `mod_source_ids` are opaque IDs (UUIDs) into the controller's own
              Postgres-backed mod source registry (see `ModSourceService` in
              `proto/controller/v1/controller.proto`) -- each one resolves, via
              sync-daemon's `RegisterSource`, to a flat list of Steam mod IDs (for
              `mod`/`collection`-kind sources) or a path on the shared local-content
              volume (for `local`-kind, zip-uploaded sources). The reconciler unions
              all of them into this server's `-mod=` launch args.
            properties:
              cdlc:
                default: []
                items:
                  type: string
                type: array
              config_map:
                description: |-
                  Name of an operator-created ConfigMap (same namespace) providing
                  per-server overrides on top of the cluster's baseline Arma config
                  (see `services/controller/src/arma_config.rs`). Unset means
                  "baseline only".
                nullable: true
                type: string
              desired_state:
                default: Running
                description: |-
                  Servers are deployment-like: this is the "should it be up" knob
                  (`ServerService::StartServer`/`StopServer`/`CreateServer`), separate
                  from `status.phase`, which tracks how far the reconciler has
                  actually gotten toward that.
                enum:
                - Running
                - Stopped
                type: string
              headless_clients:
                default: 0
                description: |-
                  How many `HeadlessClient` objects this server wants -- the
                  reconciler creates/deletes owned `HeadlessClient`s (named
                  `<server>-hc-<index>`) to match this count whenever the server
                  itself is running (see `services/controller/src/reconcile.rs`'s
                  `ensure_headless_clients`). No elasticity beyond that: changing
                  this takes effect on the next reconcile pass, same as any other
                  spec field, but there's no separate scale-in/scale-out API --
                  this one field is the whole knob.
                format: uint32
                minimum: 0.0
                type: integer
              metrics:
                description: |-
                  A metrics endpoint this server's own game process/extension
                  exposes, if any -- purely a scrape hint for the future
                  observability addon (see README.md's "Why?" and issue #17):
                  `services/controller/src/reconcile.rs`'s `ensure_deployment`
                  copies this straight into `prometheus.io/scrape`/`port`/`path`
                  annotations on the launcher Pod, the same discovery mechanism
                  every one of this chart's own services already advertises
                  themselves with. Nothing in this repo runs anything on this port
                  -- it's entirely the operator's own exporter to configure.
                nullable: true
                properties:
                  path:
                    description: Defaults to "/metrics" (the Prometheus convention) when unset.
                    nullable: true
                    type: string
                  port:
                    format: uint16
                    maximum: 65535.0
                    minimum: 0.0
                    type: integer
                required:
                - port
                type: object
              mod_source_ids:
                default: []
                items:
                  type: string
                type: array
              port:
                description: |-
                  Base game port. Arma binds a 5-port range starting here
                  (`port..=port+4`, matching the launcher image's `EXPOSE 2302-2306`)
                  -- `ServerService::CreateServer`/`StartServer` reject a port whose
                  range overlaps any other server that's running or intends to be.
                format: uint16
                maximum: 65535.0
                minimum: 0.0
                type: integer
              profiling:
                default: false
                type: boolean
            required:
            - port
            type: object
          status:
            nullable: true
            properties:
              message:
                default: ''
                type: string
              phase:
                default: Stopped
                enum:
                - Pending
                - Running
                - Failed
                - Stopped
                type: string
            type: object
        required:
        - spec
        title: ArmaServer
        type: object
    served: true
    storage: true
    subresources:
      status: {}
