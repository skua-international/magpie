apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "magpie.fullname" . }}-registry
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "magpie.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: registry
  template:
    metadata:
      labels:
        {{- include "magpie.labels" . | nindent 8 }}
        app.kubernetes.io/component: registry
      annotations:
        {{- include "magpie.prometheusAnnotations" (dict "port" .Values.registry.service.port) | nindent 8 }}
    spec:
      {{- include "magpie.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "magpie.fullname" . }}-registry
      # Deliberately no pod-level runAsNonRoot -- see controller-
      # deployment.yaml's identical comment for why (chown-local-content
      # below genuinely needs root).
      initContainers:
        {{- include "magpie.waitForPostgresInit" . | nindent 8 }}
        {{- include "magpie.chownHostPathInit" (dict "name" "local-content" "path" .Values.hostPaths.localContentPath "root" $) | nindent 8 }}
      containers:
        - name: registry
          image: {{ include "magpie.image" (dict "root" $ "override" .Values.registry.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.registry.service.port }}
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.registry.service.port }}"
            - name: NAMESPACE
              value: {{ include "magpie.namespace" . }}
            # AdminService's ExportState/ImportState read/write ArmaServer
            # objects and ConfigMaps -- controllerNamespace, not plain
            # namespace above, so this always matches wherever
            # services/controller actually manages those (see
            # config.rs's own doc on why the two can diverge).
            - name: ARMASERVER_NAMESPACE
              value: {{ include "magpie.controllerNamespace" . }}
            - name: ARMA_CONFIG_BASELINE_CONFIGMAP
              value: {{ printf "%s-arma-config-baseline" (include "magpie.fullname" .) | quote }}
            - name: LOCAL_CONTENT_ROOT
              value: /local-content
            - name: SYNC_DAEMON_URL
              value: "http://{{ include "magpie.fullname" . }}-sync-daemon:8080"
            {{- include "magpie.postgresEnv" . | nindent 12 }}
            {{- include "magpie.jwtEnv" . | nindent 12 }}
          volumeMounts:
            - name: local-content
              mountPath: /local-content
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          {{- with .Values.registry.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: local-content
          hostPath:
            path: {{ .Values.hostPaths.localContentPath }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "magpie.fullname" . }}-registry
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  type: {{ .Values.registry.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "magpie.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: registry
  ports:
    - name: http
      port: {{ .Values.registry.service.port }}
      targetPort: http
