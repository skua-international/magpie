# Auto-generated, stable across upgrades (via `lookup`, same idiom as any
# Helm chart that needs a value to persist across `helm upgrade` without
# living in values.yaml) -- the shared bearer secret both volume-manager
# and sync-daemon carry. See volume-manager-daemonset.yaml/
# sync-daemon-deployment.yaml for how each side reads it, and
# proto/volume/v1/volume.proto for why this exists at all.
{{ $secretName := "volume-manager-token" -}}
{{- $existing := lookup "v1" "Secret" (include "magpie.namespace" .) $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ if $existing }}{{ index $existing.data "token" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
