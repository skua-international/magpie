apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "magpie.fullname" . }}-sync-daemon
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-daemon
spec:
  # SQLite is a single-writer store -- never scale this beyond 1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "magpie.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sync-daemon
  template:
    metadata:
      labels:
        {{- include "magpie.labels" . | nindent 8 }}
        app.kubernetes.io/component: sync-daemon
    spec:
      {{- include "magpie.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "magpie.fullname" . }}-sync-daemon
      # /content's hostPath is contentPath, a subdirectory of
      # blobMountPath -- a plain directory on the host's bare filesystem
      # until volume-manager (a DaemonSet, no ordering guarantee relative
      # to this Deployment) actually loop-mounts the btrfs blob there.
      # Starting sync-daemon before that happens would mean it silently
      # reflink-claims against the host's real filesystem instead of the
      # blob -- exactly the reflink degradation this whole design exists
      # to avoid, and no different sync-daemon can detect from the inside
      # once it's already running. This blocks startup until /content is
      # genuinely btrfs, using the same image (no extra pull) as the main
      # container.
      initContainers:
        - name: wait-for-content-volume
          image: {{ include "magpie.image" (dict "root" $ "override" .Values.syncDaemon.image) }}
          command:
            - sh
            - -c
            - |
              echo "waiting for /content to be a real (btrfs) mount..."
              for i in $(seq 1 60); do
                fstype=$(stat -f -c %T /content 2>/dev/null || true)
                if [ "$fstype" = "btrfs" ]; then
                  echo "/content is btrfs, proceeding"
                  exit 0
                fi
                sleep 2
              done
              echo "/content never became btrfs -- is volume-manager running/healthy? (kubectl logs -l app.kubernetes.io/component=volume-manager -n {{ include "magpie.namespace" . }})" >&2
              exit 1
          volumeMounts:
            - name: content
              mountPath: /content
      containers:
        - name: sync-daemon
          image: {{ include "magpie.image" (dict "root" $ "override" .Values.syncDaemon.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: NAMESPACE
              value: {{ include "magpie.namespace" . }}
            - name: CONTENT_ROOT
              value: /content
            - name: CLAIMS_ROOT
              value: /claims
            - name: POOL_SIZE
              value: {{ .Values.syncDaemon.poolSize | quote }}
            - name: POLL_INTERVAL_SECS
              value: {{ .Values.syncDaemon.pollIntervalSecs | quote }}
            - name: STEAM_SESSION_SECRET_NAME
              value: {{ .Values.syncDaemon.steamAuth.sessionSecretName | quote }}
            {{- if .Values.syncDaemon.steamAuth.anonymous }}
            - name: ANONYMOUS_LOGIN
              value: "true"
            {{- end }}
            - name: VOLUME_MANAGER_URL
              value: "http://{{ include "magpie.fullname" . }}-volume-manager:8446"
            - name: VOLUME_MANAGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: volume-manager-token
                  key: token
            - name: VOLUME_GROW_GRACE_BYTES
              value: {{ mul .Values.volumeManager.growGraceGiB 1073741824 | quote }}
          volumeMounts:
            - name: content
              mountPath: /content
            - name: claims
              mountPath: /claims
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          {{- with .Values.syncDaemon.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # hostPath, not a PVC: content and claims must be on the very same
        # real filesystem for reflink claims to work at all (cp
        # --reflink=always can't CoW across filesystems) -- both live
        # under one parent directory by default so that's true without
        # the operator having to think about it. See crates/steam-sync's
        # claim() doc comment and services/controller's Config for more.
        - name: content
          hostPath:
            path: {{ .Values.hostPaths.contentPath }}
            type: DirectoryOrCreate
        - name: claims
          hostPath:
            path: {{ .Values.hostPaths.claimsPath }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "magpie.fullname" . }}-sync-daemon
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-daemon
spec:
  # Internal only -- the controller is sync-daemon's sole caller.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "magpie.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sync-daemon
  ports:
    - name: http
      port: 8080
      targetPort: http
