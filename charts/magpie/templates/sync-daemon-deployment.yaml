apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "magpie.fullname" . }}-sync-daemon
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-daemon
spec:
  # SQLite is a single-writer store -- never scale this beyond 1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "magpie.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sync-daemon
  template:
    metadata:
      labels:
        {{- include "magpie.labels" . | nindent 8 }}
        app.kubernetes.io/component: sync-daemon
      annotations:
        {{- include "magpie.prometheusAnnotations" (dict "port" 8080) | nindent 8 }}
    spec:
      {{- include "magpie.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "magpie.fullname" . }}-sync-daemon
      containers:
        - name: sync-daemon
          image: {{ include "magpie.image" (dict "root" $ "override" .Values.syncDaemon.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No elevated capabilities needed -- sync-daemon only ever
          # writes into its own plain, already-mounted content directory
          # now (Postgres/K8s API calls, Steam sync). The btrfs subvolume
          # snapshot/delete work per ArmaServer moved entirely into
          # services/magpie-csi's own NodeStageVolume/NodeUnstageVolume
          # (see that driver's own doc), which is where the SYS_ADMIN
          # capability this container used to need now actually lives.
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: NAMESPACE
              value: {{ include "magpie.namespace" . }}
            - name: CONTENT_ROOT
              value: /content
            - name: POOL_SIZE
              value: {{ .Values.syncDaemon.poolSize | quote }}
            - name: POLL_INTERVAL_SECS
              value: {{ .Values.syncDaemon.pollIntervalSecs | quote }}
            - name: STEAM_SESSION_SECRET_NAME
              value: {{ .Values.syncDaemon.steamAuth.sessionSecretName | quote }}
            {{- if .Values.syncDaemon.steamAuth.anonymous }}
            - name: ANONYMOUS_LOGIN
              value: "true"
            {{- end }}
          volumeMounts:
            - name: golden-content
              mountPath: /content
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          {{- with .Values.syncDaemon.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # This PVC's own StorageClass (magpie-golden-content) makes
        # NodeStageVolume bind-mount the shared blob's content/
        # subvolume directly here, read-write -- this is the one real
        # copy of every synced depot/mod. Every ArmaServer's own content
        # is a CSI inline ephemeral volume instead (no PVC at all), a
        # read-only btrfs snapshot of it taken on demand -- see
        # services/magpie-csi's NodePublishVolume doc for the split.
        - name: golden-content
          persistentVolumeClaim:
            claimName: {{ include "magpie.fullname" . }}-golden-content
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "magpie.fullname" . }}-sync-daemon
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-daemon
spec:
  # Internal only -- the controller is sync-daemon's sole caller.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "magpie.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sync-daemon
  ports:
    - name: http
      port: 8080
      targetPort: http
