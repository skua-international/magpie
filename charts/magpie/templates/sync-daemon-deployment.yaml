apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "magpie.fullname" . }}-sync-daemon
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-daemon
spec:
  # SQLite is a single-writer store -- never scale this beyond 1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "magpie.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sync-daemon
  template:
    metadata:
      labels:
        {{- include "magpie.labels" . | nindent 8 }}
        app.kubernetes.io/component: sync-daemon
      annotations:
        {{- include "magpie.prometheusAnnotations" (dict "port" 8080) | nindent 8 }}
    spec:
      {{- include "magpie.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "magpie.fullname" . }}-sync-daemon
      # distroless:nonroot (see the image's own Dockerfile) already bakes
      # in USER 65532 -- runAsNonRoot here is just belt-and-suspenders,
      # same as every other distroless service in this chart. The golden
      # content subvolume this writes into is pre-chowned to that same
      # UID/GID by magpie-csi's own privileged Node plugin (see blob.go's
      # ensureContentSubvolume) specifically so this can run non-root at
      # all.
      securityContext:
        runAsNonRoot: true
      containers:
        - name: sync-daemon
          image: {{ include "magpie.image" (dict "root" $ "override" .Values.syncDaemon.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No elevated capabilities needed -- sync-daemon only ever
          # writes into its own plain, already-mounted content directory
          # now (Postgres/K8s API calls, Steam sync). The btrfs subvolume
          # snapshot/delete work per ArmaServer moved entirely into
          # services/magpie-csi's own NodePublishVolume/NodeUnpublishVolume
          # (see that driver's own doc), which is where the SYS_ADMIN
          # capability this container used to need now actually lives.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: NAMESPACE
              value: {{ include "magpie.namespace" . }}
            - name: CONTENT_ROOT
              value: /content
            - name: POOL_SIZE
              value: {{ .Values.syncDaemon.poolSize | quote }}
            - name: DOWNLOAD_WORKERS
              value: {{ .Values.syncDaemon.downloadWorkers | quote }}
            - name: POLL_INTERVAL_SECS
              value: {{ .Values.syncDaemon.pollIntervalSecs | quote }}
            - name: CONTENT_SYNC_INTERVAL_SECS
              value: {{ .Values.syncDaemon.contentSyncIntervalSecs | quote }}
            - name: STEAM_SESSION_SECRET_NAME
              value: {{ .Values.syncDaemon.steamAuth.sessionSecretName | quote }}
            {{- if .Values.syncDaemon.steamAuth.anonymous }}
            - name: ANONYMOUS_LOGIN
              value: "true"
            {{- end }}
            # turso (steam-sync's cache.rs) writes its own internal
            # spill/overflow temp files via tempfile::tempdir() --
            # confirmed live: "failed to begin lock-steal transaction: I/O
            # error (tempdir): read-only filesystem or storage medium"
            # against readOnlyRootFilesystem's default /tmp. Explicit, not
            # relying on the emptyDir-at-/tmp mount alone matching
            # tempfile's own default path assumption.
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: golden-content
              mountPath: /content
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          {{- with .Values.syncDaemon.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # This PVC's own StorageClass (magpie-golden-content) makes
        # NodeStageVolume bind-mount the shared blob's content/
        # subvolume directly here, read-write -- this is the one real
        # copy of every synced depot/mod. Every ArmaServer's own content
        # is a CSI inline ephemeral volume instead (no PVC at all), a
        # read-only btrfs snapshot of it taken on demand -- see
        # services/magpie-csi's NodePublishVolume doc for the split.
        - name: golden-content
          persistentVolumeClaim:
            claimName: {{ include "magpie.fullname" . }}-golden-content
        # readOnlyRootFilesystem means /tmp itself isn't writable by
        # default -- this is the one thing that needs to be, for turso's
        # own internal temp files (see the TMPDIR env var above).
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "magpie.fullname" . }}-sync-daemon
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-daemon
spec:
  # Internal only -- the controller is sync-daemon's sole caller.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "magpie.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sync-daemon
  ports:
    - name: http
      port: 8080
      targetPort: http
