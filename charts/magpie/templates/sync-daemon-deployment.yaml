apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "magpie.fullname" . }}-sync-daemon
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-daemon
spec:
  # SQLite is a single-writer store -- never scale this beyond 1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "magpie.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sync-daemon
  template:
    metadata:
      labels:
        {{- include "magpie.labels" . | nindent 8 }}
        app.kubernetes.io/component: sync-daemon
      annotations:
        {{- include "magpie.prometheusAnnotations" (dict "port" 8080) | nindent 8 }}
    spec:
      {{- include "magpie.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "magpie.fullname" . }}-sync-daemon
      containers:
        - name: sync-daemon
          image: {{ include "magpie.image" (dict "root" $ "override" .Values.syncDaemon.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: NAMESPACE
              value: {{ include "magpie.namespace" . }}
            - name: CONTENT_ROOT
              value: /content
            - name: CLAIMS_ROOT
              value: /claims
            - name: POOL_SIZE
              value: {{ .Values.syncDaemon.poolSize | quote }}
            - name: POLL_INTERVAL_SECS
              value: {{ .Values.syncDaemon.pollIntervalSecs | quote }}
            - name: STEAM_SESSION_SECRET_NAME
              value: {{ .Values.syncDaemon.steamAuth.sessionSecretName | quote }}
            {{- if .Values.syncDaemon.steamAuth.anonymous }}
            - name: ANONYMOUS_LOGIN
              value: "true"
            {{- end }}
          volumeMounts:
            - name: reflink
              mountPath: /content
              subPath: content
            - name: reflink
              mountPath: /claims
              subPath: claims
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          {{- with .Values.syncDaemon.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # content and claims are subPaths of one PVC, not two separate
        # ones -- they must be on the very same real filesystem for
        # reflink claims to work at all (`cp --reflink=always` can't CoW
        # across filesystems). See reflink-pvc.yaml/reflink-
        # storageclass.yaml, services/magpie-csi, and crates/steam-sync's
        # claim() doc comment.
        - name: reflink
          persistentVolumeClaim:
            claimName: {{ include "magpie.fullname" . }}-reflink-content
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "magpie.fullname" . }}-sync-daemon
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-daemon
spec:
  # Internal only -- the controller is sync-daemon's sole caller.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "magpie.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sync-daemon
  ports:
    - name: http
      port: 8080
      targetPort: http
