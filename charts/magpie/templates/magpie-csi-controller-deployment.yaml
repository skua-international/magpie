# CSI Controller plugin -- paired with the standard external-provisioner
# sidecar, which watches PersistentVolumeClaims against the
# magpie-golden-content StorageClass (the only one that uses this path
# at all -- every ArmaServer's own content is a CSI inline ephemeral
# volume instead, which skips the Controller service entirely, see
# services/magpie-csi/internal/driver/node.go's NodePublishVolume doc)
# and calls magpie-csi's own CreateVolume/DeleteVolume over the shared
# Unix socket in /csi (an emptyDir, purely local IPC between the two
# containers in this Pod -- not the same socket kubelet talks to, that's
# the Node plugin's own, registered via node-driver-registrar in
# magpie-csi-node-daemonset.yaml).
#
# Deliberately not privileged -- CreateVolume/DeleteVolume do no host
# work at all (see services/magpie-csi/internal/driver/controller.go's
# own doc for why), only the Node plugin needs real device access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "magpie.fullname" . }}-magpie-csi-controller
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: magpie-csi-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "magpie.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: magpie-csi-controller
  template:
    metadata:
      labels:
        {{- include "magpie.labels" . | nindent 8 }}
        app.kubernetes.io/component: magpie-csi-controller
    spec:
      {{- include "magpie.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "magpie.fullname" . }}-magpie-csi-controller
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
          args:
            - "--csi-address=/csi/csi.sock"
            - "--feature-gates=Topology=true"
            - "--leader-election=false"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        # Standard CSI sidecar: calls the driver's own Identity.Probe RPC
        # over the shared socket and exposes a real /healthz kubelet can
        # check -- without this, the magpie-csi container's own liveness
        # was just "the process is up", which stayed green even while
        # csi-provisioner sat retrying forever on an RBAC error
        # (confirmed live -- the Pod showed healthy the whole time).
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.14.0
          args:
            - "--csi-address=/csi/csi.sock"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: magpie-csi
          image: {{ include "magpie.image" (dict "root" $ "override" .Values.magpieCsi.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Same image the privileged Node plugin uses (it needs real
          # root for losetup/mount/btrfs -- see magpie-csi-node-
          # daemonset.yaml), so it can't bake a nonroot USER into the
          # image itself the way the other services do. This container
          # specifically does none of that (see this file's own top
          # comment: CreateVolume/DeleteVolume do no host work at all),
          # so it can still run locked down -- just declared here
          # instead of in the Dockerfile. Only this container, not the
          # csi-provisioner/liveness-probe sidecars above (third-party
          # images; not worth the risk of assuming their own UID/
          # capability expectations without verifying live).
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          # livenessprobe's own default port -- served by the sidecar
          # above, not this container, but Pod containers share one
          # network namespace so kubelet reaching it via this
          # container's own probe stanza works the same either way.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9808
            initialDelaySeconds: 5
            timeoutSeconds: 5
          {{- with .Values.magpieCsi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: socket-dir
          emptyDir: {}
