apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "magpie.fullname" . }}-controller
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  # A single reconciler instance -- kube-runtime's Controller loop isn't
  # leader-elected here, so running more than one would mean two processes
  # racing to reconcile the same ArmaServer objects.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "magpie.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "magpie.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
      annotations:
        {{- include "magpie.prometheusAnnotations" (dict "port" 8080) | nindent 8 }}
    spec:
      {{- include "magpie.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "magpie.fullname" . }}-controller
      securityContext:
        runAsNonRoot: true
      initContainers:
        {{- include "magpie.waitForPostgresInit" . | nindent 8 }}
      containers:
        - name: controller
          image: {{ include "magpie.image" (dict "root" $ "override" .Values.controller.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          env:
            {{- include "magpie.otelEnv" . | nindent 12 }}
            - name: NAMESPACE
              value: {{ include "magpie.controllerNamespace" . }}
            - name: LAUNCHER_IMAGE
              value: {{ include "magpie.image" (dict "root" $ "override" .Values.launcherImage) | quote }}
            - name: IMAGE_PULL_SECRETS
              value: {{ join "," .Values.imagePullSecrets | quote }}
            - name: SYNC_DAEMON_URL
              value: "http://{{ include "magpie.fullname" . }}-sync-daemon:8080"
            - name: SERVER_ROOT_BASE
              value: {{ .Values.controller.serverRootBase | quote }}
            - name: LOCAL_CONTENT_ROOT
              value: /local-content
            - name: LOCAL_CONTENT_HOST_PATH
              value: {{ .Values.hostPaths.localContentPath | quote }}
            # Admin-level Postgres connection -- used only to provision
            # the technical role below on startup (see
            # postgres_bootstrap.rs); the controller otherwise never
            # touches this database itself.
            {{- include "magpie.postgresEnv" . | nindent 12 }}
            - name: APP_POSTGRES_ROLE
              value: {{ .Values.postgres.appUser | quote }}
            - name: APP_POSTGRES_SECRET_NAME
              value: {{ .Values.postgres.appSecretName | quote }}
            - name: APP_POSTGRES_DATABASE
              value: {{ .Values.postgres.database | quote }}
            # Passed straight through into every launcher Pod's own
            # DATABASE_HOST/PORT env vars -- see ensure_deployment.
            - name: APP_POSTGRES_HOST
              value: {{ include "magpie.postgresHost" . | quote }}
            - name: APP_POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: ARMA_CONFIG_BASELINE_CONFIGMAP
              value: {{ printf "%s-arma-config-baseline" (include "magpie.fullname" .) | quote }}
            - name: USER_SECRETS_NAMESPACE
              value: {{ .Values.userSecretsNamespace | quote }}
            # Empty/off by default -- see controller's Config::arma_ld_preload
            # and launcher's Config::ld_preload for what this actually does
            # (LD_PRELOAD an allocator, e.g. mimalloc, into arma3server_x64
            # specifically; Arma's own -malloc=/CMA system is Windows-only).
            - name: ARMA_LD_PRELOAD
              value: {{ .Values.armaServer.ldPreload | default "" | quote }}
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # arma_config.rs writes main.cfg/basic.cfg directly onto this
            # tree -- mounted at the *same* path the host uses (rather
            # than a different container-local path, the way local-
            # content/claims are split from their own host-path
            # counterparts) since SERVER_ROOT_BASE above is also reused
            # as-is to build every launcher Pod's own hostPath source
            # (ensure_deployment); keeping both uses of the same config
            # value mean the same thing avoids a second path-translation
            # field for no real benefit.
            - name: server-roots
              mountPath: {{ .Values.controller.serverRootBase }}
      volumes:
        - name: server-roots
          hostPath:
            path: {{ .Values.controller.serverRootBase }}
            type: DirectoryOrCreate
