# Password for launcher's Arma-process technical Postgres role (see
# postgres_bootstrap.rs) -- generated once via lookup+randAlphaNum, so
# it stays stable across upgrades instead of being minted by controller
# code at runtime.
# Created unconditionally, even when postgres.enabled is false: the
# technical user is provisioned against whatever Postgres is in play
# (chart-managed or external), not just the chart-managed case.
{{ $secretName := .Values.postgres.appSecretName -}}
{{- $existing := lookup "v1" "Secret" (include "magpie.namespace" .) $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ if $existing }}{{ index $existing.data "POSTGRES_PASSWORD" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
