{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "magpie.fullname" . }}-controller
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "magpie.fullname" . }}-controller
  namespace: {{ include "magpie.controllerNamespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
rules:
  # The reconciler needs full ArmaServer access (read the spec, patch
  # status) and full Deployment access (create/update/delete the launcher
  # workload) -- this is the one process in the chart that actually
  # mutates cluster workloads, which is exactly why serverApi's RBAC below
  # is scoped to *not* include Deployments at all.
  - apiGroups: ["arma.skua.io"]
    resources: ["armaservers"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["arma.skua.io"]
    resources: ["armaservers/status"]
    verbs: ["get", "update", "patch"]
  # Read-only -- resolve_mod_paths reads a referenced ModSource's spec to
  # build -mod= args. Never creates/deletes/patches one; that's
  # services/registry's job.
  - apiGroups: ["arma.skua.io"]
    resources: ["modsources"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only, scoped to just the one Secret the controller needs the
  # plaintext password out of to run its Postgres GRANT/ALTER ROLE
  # bootstrap (see postgres_bootstrap.rs) -- the chart itself creates the
  # object (app-postgres-secret.yaml, via lookup+randAlphaNum), so no
  # create/patch verb is needed here at all.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.postgres.appSecretName | quote }}]
    verbs: ["get"]
  # ConfigMaps holding Arma server config (see arma_config.rs) --
  # unrestricted by resourceNames unlike the Secret above, since
  # per-server override ConfigMap names are operator-chosen and
  # unpredictable. Read-only, and ConfigMaps here hold no secrets
  # themselves (only secret: *references*, resolved against the
  # separate user-secrets namespace below) -- an acceptable, low-
  # sensitivity boundary to leave unscoped.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "magpie.fullname" . }}-controller
  namespace: {{ include "magpie.controllerNamespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "magpie.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "magpie.fullname" . }}-controller
    namespace: {{ include "magpie.namespace" . }}
---
# Cross-namespace: secret: references in Arma config
# ConfigMaps (arma_config.rs) resolve against this dedicated namespace,
# not the controller's own -- see user-secrets-namespace.yaml's doc.
# Bound to the same ServiceAccount, just via a Role/RoleBinding pair
# that live in the *target* namespace instead (RoleBindings can
# reference a ServiceAccount from any namespace; only the Role/
# RoleBinding objects themselves have to live where the permission
# applies).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "magpie.fullname" . }}-user-secrets-reader
  namespace: {{ .Values.userSecretsNamespace }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "magpie.fullname" . }}-user-secrets-reader
  namespace: {{ .Values.userSecretsNamespace }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "magpie.fullname" . }}-user-secrets-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "magpie.fullname" . }}-controller
    namespace: {{ include "magpie.namespace" . }}
{{- end }}
