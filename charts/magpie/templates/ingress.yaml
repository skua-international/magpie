{{- if .Values.ingress.enabled }}
{{- range $svc, $port := (dict "identity" .Values.identity.service.port "registry" .Values.registry.service.port "server-api" .Values.serverApi.service.port) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "magpie.fullname" $ }}-{{ $svc }}
  namespace: {{ include "magpie.namespace" $ }}
  labels:
    {{- include "magpie.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc }}
  {{- if $.Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  {{- if $.Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ printf "%s.%s" $svc $.Values.ingress.baseDomain }}
      secretName: {{ include "magpie.fullname" $ }}-{{ $svc }}-tls
  {{- end }}
  rules:
    - host: {{ printf "%s.%s" $svc $.Values.ingress.baseDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "magpie.fullname" $ }}-{{ $svc }}
                port:
                  number: {{ $port }}
{{- end }}
{{- end }}
