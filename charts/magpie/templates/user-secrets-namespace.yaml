# Dedicated namespace for Secrets an operator wants referenceable from
# Arma config ConfigMaps (the secret: placeholder, see arma_config.rs and
# README's "Arma server config" section) -- deliberately separate from
# the chart's own namespace, which also holds arma-postgres-creds/
# ghcr-pull-secret/etc. Scoping the controller's cross-namespace Secret
# read (controller-rbac.yaml) to just this namespace means the worst an
# operator-controlled ConfigMap value can do is read a secret someone
# deliberately put here for this purpose, not anything else in the
# cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.userSecretsNamespace }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
