apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "magpie.fullname" . }}-identity
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "magpie.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: identity
  template:
    metadata:
      labels:
        {{- include "magpie.labels" . | nindent 8 }}
        app.kubernetes.io/component: identity
      annotations:
        {{- include "magpie.prometheusAnnotations" (dict "port" .Values.identity.service.port) | nindent 8 }}
    spec:
      {{- include "magpie.imagePullSecrets" . | nindent 6 }}
      # No ServiceAccount token needed -- this service never talks to the
      # Kubernetes API, only Postgres.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      initContainers:
        {{- include "magpie.waitForPostgresInit" . | nindent 8 }}
      containers:
        - name: identity
          image: {{ include "magpie.image" (dict "root" $ "override" .Values.identity.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.identity.service.port }}
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.identity.service.port }}"
            - name: BASE_URL
              value: {{ include "magpie.identityBaseUrl" . | quote }}
            {{- with .Values.identity.allowedRedirectOrigins }}
            # BASE_URL's own origin is always allowed by the service
            # itself, so this only carries genuinely extra origins --
            # see identity.allowedRedirectOrigins in values.yaml.
            - name: ALLOWED_REDIRECT_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: JWT_ISSUER
              value: {{ required "jwt.issuer is required" .Values.jwt.issuer | quote }}
            - name: JWT_AUDIENCE
              value: {{ required "jwt.audience is required" .Values.jwt.audience | quote }}
            {{- include "magpie.postgresEnv" . | nindent 12 }}
            {{- if .Values.identity.oauthSecret }}
            {{- range list "DISCORD" "GITHUB" "GOOGLE" }}
            - name: {{ . }}_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.identity.oauthSecret }}
                  key: {{ . }}_CLIENT_ID
                  optional: true
            - name: {{ . }}_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.identity.oauthSecret }}
                  key: {{ . }}_CLIENT_SECRET
                  optional: true
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          {{- with .Values.identity.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "magpie.fullname" . }}-identity
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
spec:
  type: {{ .Values.identity.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "magpie.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: identity
  ports:
    - name: http
      port: {{ .Values.identity.service.port }}
      targetPort: http
