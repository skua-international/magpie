# Pre-created empty -- sync-daemon fills it in itself once a session
# exists. Existing this deliberately (rather than letting sync-daemon
# create it on demand) means its own RBAC only ever needs get/patch on
# one specific named object (resourceNames), never a broad create grant
# on Secrets -- see secrets.rs's own doc for why that distinction matters.
# `data: {}` on create is intentional -- a real one only ever arrives via
# a patch, never overwritten by a later `helm upgrade` re-applying this
# template (Helm's own apply semantics don't clobber fields a template
# doesn't set, and this template never sets `data` at all after this
# first create).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.syncDaemon.steamAuth.sessionSecretName }}
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
