{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "magpie.fullname" . }}-gateway
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "magpie.fullname" . }}-gateway
  namespace: {{ include "magpie.gatewayNamespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
rules:
  # Deliberately no apps/Deployments access at all -- this is the one
  # process a compromised bearer token gets to talk to directly, so it
  # only ever needs to read/write ArmaServer objects. Actually creating or
  # deleting the launcher Deployment is services/controller's reconciler's
  # job, running under a completely separate ServiceAccount.
  - apiGroups: ["arma.skua.io"]
    resources: ["armaservers"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["arma.skua.io"]
    resources: ["armaservers/status"]
    verbs: ["get", "patch"]
  # Read-only -- resync_and_repending checks a referenced ModSource's kind
  # (skip refresh_source for local/zip sources). Never writes one; that's
  # services/registry's job.
  - apiGroups: ["arma.skua.io"]
    resources: ["modsources"]
    verbs: ["get"]
  # Read-only, and the only non-CRD access this service has. Needed for
  # GetServerHealth (a pod's Ready condition *is* the A2S query probe in
  # services/launcher/src/healthcheck.rs) and GetServerLogs.
  #
  # This does widen what a stolen bearer token reaches -- gateway is the
  # most exposed process here, and pod logs can contain whatever a server
  # or its mods chose to print. Kept to get/list with no write verbs, and
  # GetServerLogs sits behind its own servers:logs scope rather than
  # servers:read, so listing servers doesn't imply reading their output.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "magpie.fullname" . }}-gateway
  namespace: {{ include "magpie.gatewayNamespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "magpie.fullname" . }}-gateway
subjects:
  - kind: ServiceAccount
    name: {{ include "magpie.fullname" . }}-gateway
    namespace: {{ include "magpie.namespace" . }}
{{- end }}
