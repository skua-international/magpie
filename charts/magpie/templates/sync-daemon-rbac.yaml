{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "magpie.fullname" . }}-sync-daemon
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "magpie.fullname" . }}-sync-daemon
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
rules:
  # The ModSource reconciler (every kind except Local, which
  # services/registry resolves synchronously itself) -- resolves a source's
  # candidate IDs into a mod list and writes status. Never creates/deletes
  # a ModSource itself (that's registry's job via its own RPCs); "patch" on
  # the base resource is for the finalizer's own metadata.finalizers merge.
  - apiGroups: ["arma.skua.io"]
    resources: ["modsources"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["arma.skua.io"]
    resources: ["modsources/status"]
    verbs: ["get", "update", "patch"]
  # Scoped to exactly one pre-existing, chart-created Secret
  # (steam-session-secret.yaml) -- resourceNames can't restrict a create
  # verb at all (no object name to check yet), so no create here; the
  # chart owns creating the empty object, this only ever reads/updates
  # its data once a session exists.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.syncDaemon.steamAuth.sessionSecretName | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "magpie.fullname" . }}-sync-daemon
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "magpie.fullname" . }}-sync-daemon
subjects:
  - kind: ServiceAccount
    name: {{ include "magpie.fullname" . }}-sync-daemon
    namespace: {{ include "magpie.namespace" . }}
{{- end }}
