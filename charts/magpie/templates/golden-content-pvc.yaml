# The one golden, continuously-synced content tree -- sync-daemon writes
# here directly. Every ArmaServer's own content instead comes from a CSI
# inline ephemeral volume (no PVC/StorageClass at all -- see
# services/controller/src/reconcile.rs's launcher Pod spec), a read-only
# btrfs snapshot of this one taken on demand by services/magpie-csi.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "magpie.fullname" . }}-golden-content
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: magpie-golden-content
  resources:
    requests:
      # The blob's guaranteed floor: the size magpie-csi holds it at
      # regardless of how little content is currently synced.
      # reflinkStorage.maxSizeGiB is the ceiling, and the capacity
      # watchdog moves the real size between the two.
      #
      # This used to be an unchangeable hardcoded 40Gi -- the
      # StorageClass had no allowVolumeExpansion and the driver no
      # EXPAND_VOLUME capability, so the API server rejected any
      # `helm upgrade` that changed it ("only dynamically provisioned pvc
      # can be resized and the storageclass that provisions the pvc must
      # support resize"). Both are in place now, so raising this value
      # and upgrading genuinely grows the blob, via ControllerExpandVolume
      # -> NodeExpandVolume -> blob.SetFloor.
      #
      # Still one-way: Kubernetes never shrinks a PVC. Lowering this
      # value won't shrink anything (the API server rejects it) -- to
      # actually reclaim space, lower reflinkStorage.maxSizeGiB and let
      # the watchdog shrink toward it.
      storage: {{ .Values.reflinkStorage.goldenContentGiB }}Gi
