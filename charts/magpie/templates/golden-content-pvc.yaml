# The one golden, continuously-synced content tree -- sync-daemon writes
# here directly. Every ArmaServer's own content instead comes from a CSI
# inline ephemeral volume (no PVC/StorageClass at all -- see
# services/controller/src/reconcile.rs's launcher Pod spec), a read-only
# btrfs snapshot of this one taken on demand by services/magpie-csi.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "magpie.fullname" . }}-golden-content
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: magpie-golden-content
  resources:
    requests:
      # DO NOT CHANGE THIS VALUE, ever -- confirmed live: the
      # magpie-golden-content StorageClass supports no resize at all (no
      # allowVolumeExpansion, no EXPAND_VOLUME capability), so the API
      # server rejects `helm upgrade`/`kubectl apply` outright the moment
      # this differs from whatever's already on the live PVC ("only
      # dynamically provisioned pvc can be resized and the storageclass
      # that provisions the pvc must support resize"). This number is
      # otherwise non-binding -- magpie-csi's CreateVolume echoes it back
      # but never enforces it (storageCapacity: false in its CSIDriver
      # spec); real sizing is the capacity watchdog's job at runtime (see
      # values.yaml's reflinkStorage.maxSizeGiB). 40Gi purely because
      # that's what every existing cluster's PVC already has on disk.
      storage: 40Gi
