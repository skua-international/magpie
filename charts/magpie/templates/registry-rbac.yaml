{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "magpie.fullname" . }}-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "magpie.fullname" . }}-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
rules:
  # ModSourceService is a thin, JWT-authenticated CRUD front end for the
  # ModSource CRD -- the same shape services/server-api already is for
  # ArmaServer. Local (zip) sources are also fully resolved here (no Steam
  # session needed), so this is the one process besides
  # services/sync-daemon's own reconciler that ever writes ModSource
  # status.
  - apiGroups: ["arma.skua.io"]
    resources: ["modsources"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["arma.skua.io"]
    resources: ["modsources/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "magpie.fullname" . }}-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "magpie.fullname" . }}-registry
subjects:
  - kind: ServiceAccount
    name: {{ include "magpie.fullname" . }}-registry
    namespace: {{ .Release.Namespace }}
{{- end }}
