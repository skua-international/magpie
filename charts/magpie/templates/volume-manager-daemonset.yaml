# One per node (DaemonSet, not a Deployment) -- loop-device/btrfs
# management is inherently node-local, and this sets up cleanly for an
# eventual multi-node cluster where each node has its own blob (see
# proto/volume/v1/volume.proto's own doc: btrfs isn't a cluster
# filesystem, so this is never one blob shared live across nodes).
#
# Runs as a dedicated, non-root magpie-volume user/group -- provisioned on
# the host by `magpiectl install` (see cli/magpie/internal/deploy/
# volumeuser.go), not privileged: true. Loop-device attach, mount(2), and
# btrfs's resize ioctl all genuinely need CAP_SYS_ADMIN (there's no
# finer-grained capability for any of the three in mainline Linux), so
# that one capability is still granted -- but nothing else `privileged:
# true` would also hand over (CAP_SYS_MODULE, CAP_NET_ADMIN, disabled
# seccomp/AppArmor confinement, ...), and it runs as a real non-root UID
# whose only host-side access is what the install-time provisioning
# explicitly grants (the blob paths below, and the loop control/device
# nodes via a dedicated udev rule).
#
# hostPID: true is the other half of staying unprivileged -- Kubernetes
# hard-requires privileged: true for mountPropagation: Bidirectional (no
# capability grant substitutes, confirmed against a real cluster), which
# this used to rely on to leak its own mount out to the host. Instead,
# src/blob.rs runs mount/findmnt/btrfs-resize/df directly inside PID 1's
# mount namespace via `nsenter --target 1 --mount` -- hostPID is what
# makes PID 1 here actually be the host's init rather than some other pid
# namespace's. There's therefore no blob-mount volume/mount in this pod
# spec at all any more: every command that touches the mount goes
# straight at the real host path (hostPaths.blobMountPath), never a
# container-local view of it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "magpie.fullname" . }}-volume-manager
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: volume-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "magpie.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: volume-manager
  template:
    metadata:
      labels:
        {{- include "magpie.labels" . | nindent 8 }}
        app.kubernetes.io/component: volume-manager
    spec:
      hostPID: true
      {{- include "magpie.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: volume-manager
          image: {{ include "magpie.image" (dict "root" $ "override" .Values.volumeManager.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: {{ required "volumeManager.runAsUser is required -- set by `magpiectl install` from the host user it provisions, see volumeuser.go" .Values.volumeManager.runAsUser }}
            runAsGroup: {{ required "volumeManager.runAsGroup is required -- set by `magpiectl install` from the host group it provisions, see volumeuser.go" .Values.volumeManager.runAsGroup }}
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["SYS_ADMIN"]
            # CAP_SYS_ADMIN alone isn't enough for setns(CLONE_NEWNS) into
            # PID 1's mount namespace -- confirmed live: "nsenter:
            # reassociate to namespaces failed: Operation not permitted"
            # even with the capability granted. AppArmor is a separate MAC
            # layer capabilities don't bypass, and containerd's default
            # profile denies this; unconfined only for this one container,
            # which is already the one place in the chart with elevated
            # capabilities to begin with.
            appArmorProfile:
              type: Unconfined
          ports:
            - name: http
              containerPort: 8446
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8446"
            - name: BLOB_IMAGE_PATH
              value: "/blob/{{ base .Values.hostPaths.blobImage }}"
            # A real host path, not a container-local one -- src/blob.rs
            # runs every command that touches it via nsenter into PID 1's
            # (the host's, thanks to hostPID above) mount namespace. See
            # this file's own header comment.
            - name: BLOB_MOUNT_PATH
              value: {{ .Values.hostPaths.blobMountPath | quote }}
            - name: INITIAL_SIZE_BYTES
              value: {{ mul .Values.volumeManager.initialSizeGiB 1073741824 | quote }}
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: volume-manager-token
                  key: token
          volumeMounts:
            # Just the backing image file -- ordinary files aren't scoped
            # to a mount namespace, so this needs no propagation setting.
            # The mount itself (BLOB_MOUNT_PATH) is never bind-mounted
            # into this container at all -- see this file's own header.
            - name: blob-image-dir
              mountPath: /blob
            # Loop device *node files* (/dev/loopN) live in /dev, which --
            # unlike the loop driver's own kernel-global block-device
            # numbers -- is a private, per-container tmpfs by default, not
            # populated with any loop nodes at all. Confirmed live:
            # "losetup: device node /dev/loop0 (7:0) is lost. You may use
            # mknod(1) to recover it." Bind-mounting the host's real /dev
            # is the standard fix for containers needing loop devices,
            # consistent with this already being the one container in the
            # chart with real host block-device access.
            - name: dev
              mountPath: /dev
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          {{- with .Values.volumeManager.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: blob-image-dir
          hostPath:
            path: {{ dir .Values.hostPaths.blobImage }}
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "magpie.fullname" . }}-volume-manager
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
    app.kubernetes.io/component: volume-manager
spec:
  # Internal only -- sync-daemon is its sole caller (also enforced by the
  # NetworkPolicy below, on clusters whose CNI actually enforces
  # NetworkPolicy -- k3s's bundled default, flannel, does not; Calico/
  # Cilium do. The bearer-token check in volume-manager itself is the
  # real, always-enforced boundary -- this is defense in depth on top of
  # it, not instead of it).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "magpie.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: volume-manager
  ports:
    - name: http
      port: 8446
      targetPort: http
