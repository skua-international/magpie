# Backs sync-daemon's content/claims PVC (reflink-pvc.yaml) via
# services/magpie-csi -- a small local-storage CSI driver that
# loop-mounts a growable btrfs blob per node, so `cp --reflink=always`
# CoW claims work regardless of what filesystem the host itself actually
# has. See magpie-csi's own doc for why this replaced volume-manager's
# bespoke Connect-RPC design.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: magpie-reflink
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
provisioner: csi.magpie.skua.io
# This is the golden, continuously-synced content tree every server's
# claims come from -- losing it because a PVC got deleted (e.g. during
# a botched upgrade) would mean a full re-sync of everything, not just
# that one server. Retain, not Delete.
reclaimPolicy: Retain
# Local storage is host-pinned -- delay binding until a Pod referencing
# the PVC is actually scheduled, so the CSI provisioner knows which
# node's blob to create the volume on instead of guessing.
volumeBindingMode: WaitForFirstConsumer
