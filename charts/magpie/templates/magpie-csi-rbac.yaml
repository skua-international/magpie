{{- if .Values.rbac.create }}
# ServiceAccount/RBAC for external-provisioner (the standard CSI
# sidecar magpie-csi-controller-deployment.yaml pairs with) -- this is
# the well-known, documented RBAC every external-provisioner deployment
# needs (kubernetes-csi/external-provisioner's own deploy manifests are
# the reference this mirrors), not anything magpie-csi's own binary
# needs directly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "magpie.fullname" . }}-magpie-csi-controller
  namespace: {{ include "magpie.namespace" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "magpie.fullname" . }}-magpie-csi-provisioner
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    # patch/update are both needed -- confirmed live: without patch,
    # external-provisioner successfully creates the PV (Provisioning
    # succeeded) but then fails forever trying to add the
    # kubernetes.io/pv-protection finalizer to it ("cannot patch
    # resource \"persistentvolumes\"").
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # external-resizer shares this ServiceAccount with external-provisioner
  # rather than getting its own -- both are sidecars in the same Pod, so
  # a separate SA would only be able to differ in name. Everything it
  # needs beyond the provisioner's grants above is this one subresource:
  # it writes the observed capacity back to the PVC once expansion
  # completes, and without it a resize appears to hang forever with the
  # PVC stuck on the FileSystemResizePending condition.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "magpie.fullname" . }}-magpie-csi-provisioner
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "magpie.fullname" . }}-magpie-csi-provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "magpie.fullname" . }}-magpie-csi-controller
    namespace: {{ include "magpie.namespace" . }}
{{- end }}
